name: Linux MiniMachine Init Handoff Hot

on:
  push:
    branches: [work/checkpoint-after-kallsyms]
    paths:
      - .github/workflows/init-handoff-hot.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  init-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Download prepare_namespace checkpoint
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33261446210
          github-token: ${{ github.token }}
          name: minimachine-blake2s-fast-33261446210
          path: checkpoint-source

      - name: Download P3 program cache
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33249488447
          github-token: ${{ github.token }}
          name: minimachine-double-hot-33249488447
          path: p3-cache-source

      - name: Find matching Linux LLVM artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/linux-minimachine-boot.yml/runs?status=completed&per_page=30"               --jq '.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main") | .id' |
              head -n 1
          )"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download linked Linux LLVM image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: minimachine-linux-boot-*
          path: replay-source
          merge-multiple: true

      - name: Prepare handoff inputs
        run: |
          checkpoint="$(find checkpoint-source -name 'blake2s-fast-next.chk.gz' -print -quit)"
          cache="$(find p3-cache-source -name 'linux-p3-cache.pkl.gz' -print -quit)"
          test -n "$checkpoint"
          test -n "$cache"
          cp "$checkpoint" replay-source/llvm/hot-prepare.chk.gz
          cp "$cache" replay-source/llvm/linux-p3-cache.pkl.gz

      - name: Continue through init handoff toward kernel_execve
        run: |
          set +e
          set -o pipefail
          python3 scripts/run-minimachine-linux.py replay-source/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --program-cache-in replay-source/llvm/linux-p3-cache.pkl.gz             --checkpoint-in replay-source/llvm/hot-prepare.chk.gz             --checkpoint-out replay-source/llvm/init-handoff-next.chk.gz             --checkpoint-function kernel_execve             --checkpoint-function-hit 1             --stop-after-checkpoint             --checkpoint-at-limit             --checkpoint-on-error             --max-steps 120000000             --progress-every 0             2>&1 | tee replay-source/llvm/init-handoff.log
          status=${PIPESTATUS[0]}
          set -e
          echo "INIT_HANDOFF_STATUS $status"
          grep -E 'BOOT_EXEC_(CHECKPOINT_RESTORED|CHECKPOINT_SAVED|CHECKPOINT_FUNCTION_PROGRESS|BLOCKED|HALTED|MILESTONE)' replay-source/llvm/init-handoff.log | tail -n 160 || true
          test -s replay-source/llvm/init-handoff-next.chk.gz || true

      - name: Upload handoff checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-init-handoff-${{ github.run_id }}
          path: |
            replay-source/llvm/init-handoff.log
            replay-source/llvm/init-handoff-next.chk.gz
          if-no-files-found: ignore
          retention-days: 14
