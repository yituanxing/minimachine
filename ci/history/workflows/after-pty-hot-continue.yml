name: Linux MiniMachine After PTY Hot Continue

on:
  push:
    branches: [work/checkpoint-after-kallsyms]
    paths:
      - .github/workflows/after-pty-hot-continue.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: minimachine-after-pty-hot-continue
  cancel-in-progress: true

jobs:
  continue:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4

      - name: Download after-PTY checkpoint
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33249865846
          github-token: ${{ github.token }}
          name: minimachine-after-pty-33249865846
          path: after-pty-source

      - name: Download P3 program cache
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33249488447
          github-token: ${{ github.token }}
          name: minimachine-double-hot-33249488447
          path: p3-cache-source

      - name: Find matching Linux LLVM artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/linux-minimachine-boot.yml/runs?status=completed&per_page=30"               --jq '.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main") | .id' |
              head -n 1
          )"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "HOT_SOURCE_RUN $run_id"

      - name: Download linked Linux LLVM image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: minimachine-linux-boot-*
          path: replay-source
          merge-multiple: true

      - name: Prepare hot inputs
        run: |
          checkpoint="$(find after-pty-source -name 'after-pty.chk.gz' -print -quit)"
          cache="$(find p3-cache-source -name 'linux-p3-cache.pkl.gz' -print -quit)"
          test -n "$checkpoint"
          test -n "$cache"
          test -s "$checkpoint"
          test -s "$cache"
          cp "$checkpoint" replay-source/llvm/after-pty.chk.gz
          cp "$cache" replay-source/llvm/linux-p3-cache.pkl.gz
          echo "AFTER_PTY_BYTES $(stat -c%s replay-source/llvm/after-pty.chk.gz)"
          echo "P3_CACHE_BYTES $(stat -c%s replay-source/llvm/linux-p3-cache.pkl.gz)"

      - name: Continue hot replay past aio_setup
        run: |
          set +e
          set -o pipefail
          python3 scripts/run-minimachine-linux.py replay-source/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --program-cache-in replay-source/llvm/linux-p3-cache.pkl.gz             --checkpoint-in replay-source/llvm/after-pty.chk.gz             --checkpoint-initcall aio_setup             --checkpoint-out replay-source/llvm/after-pty-next.chk.gz             --checkpoint-function prepare_namespace             --checkpoint-function-hit 1             --stop-after-checkpoint             --checkpoint-at-limit             --max-steps 80000000             --progress-every 0             2>&1 | tee replay-source/llvm/after-pty-hot.log
          status=${PIPESTATUS[0]}
          set -e
          echo "HOT_CONTINUE_STATUS $status"
          grep -F 'BOOT_EXEC_PROGRAM_CACHE_LOADED' replay-source/llvm/after-pty-hot.log
          grep -F 'BOOT_EXEC_CHECKPOINT_RESTORED' replay-source/llvm/after-pty-hot.log
          test -s replay-source/llvm/after-pty-next.chk.gz
          tail -n 160 replay-source/llvm/after-pty-hot.log
          echo "NEXT_CHECKPOINT_BYTES $(stat -c%s replay-source/llvm/after-pty-next.chk.gz)"

      - name: Upload next hot checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-after-pty-next-${{ github.run_id }}
          path: |
            replay-source/llvm/after-pty-hot.log
            replay-source/llvm/after-pty-next.chk.gz
          if-no-files-found: ignore
          retention-days: 14
