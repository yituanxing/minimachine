name: MiniMachine P3 VFS Branch Probe

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - .github/workflows/p3-vfs-branch-probe.yml

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download old P3 cache
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33249488447
          github-token: ${{ github.token }}
          name: minimachine-double-hot-33249488447
          path: cache

      - name: Download old linked image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33245921667
          github-token: ${{ github.token }}
          name: minimachine-linux-boot-33245921667
          path: image

      - name: Dump P3 branch region
        run: |
          cp "$(find cache -name 'linux-p3-cache.pkl.gz' -print -quit)" /tmp/linux-p3-cache.pkl.gz
          python3 - <<'PY'
          from pathlib import Path
          from src.minimachine.checkpoint import image_fingerprint
          from src.minimachine.program_cache import load_program_cache

          ll=Path("image/llvm/linked.ll").read_text()
          cached=load_program_cache(Path("/tmp/linux-p3-cache.pkl.gz"), image_sha256=image_fingerprint(ll))
          fn=cached.program.functions["open_last_lookups"].function
          for block in fn.blocks:
              if block.label in {"154","154.__abi_cont316","167","167.__abi_cont348","175","179"}:
                  print(f"===== {block.label} =====")
                  for i,inst in enumerate(block.instructions):
                      print(i, repr(inst))
          desc=cached.program.symbol_addresses.get("__mm_and_32")
          print("AND_DESC", hex(desc) if desc is not None else None)
          if desc is not None:
              print("AND_ENTRY", hex(cached.program.initial_memory.read(desc,64)))
              print("AND_FRAME", cached.program.initial_memory.read(desc+8,64))
          PY
