name: Linux MiniMachine Prepare Init Hot

on:
  push:
    branches: [work/checkpoint-after-kallsyms]
    paths:
      - .github/workflows/prepare-init-hot.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  init:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4

      - name: Download prepare_namespace checkpoint
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33261446210
          github-token: ${{ github.token }}
          name: minimachine-blake2s-fast-33261446210
          path: checkpoint-source

      - name: Download old P3 cache
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33249488447
          github-token: ${{ github.token }}
          name: minimachine-double-hot-33249488447
          path: p3-cache-source

      - name: Download old linked image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33245921667
          github-token: ${{ github.token }}
          name: minimachine-linux-boot-33245921667
          path: replay-source

      - name: Build /init and prepare inputs
        run: |
          python3 scripts/build-minimachine-initramfs.py             replay-source/llvm/hot-initramfs.cpio             --init-output replay-source/llvm/hot-init.bflt
          cp "$(find checkpoint-source -name 'blake2s-fast-next.chk.gz' -print -quit)" replay-source/llvm/hot-prepare.chk.gz
          cp "$(find p3-cache-source -name 'linux-p3-cache.pkl.gz' -print -quit)" replay-source/llvm/linux-p3-cache.pkl.gz

      - name: Inject /init, bypass unneeded mount, continue to bFLT
        run: |
          set +e
          set -o pipefail
          python3 scripts/run-minimachine-linux.py replay-source/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --program-cache-in replay-source/llvm/linux-p3-cache.pkl.gz             --checkpoint-in replay-source/llvm/hot-prepare.chk.gz             --inject-init replay-source/llvm/hot-init.bflt             --skip-prepare-namespace-after-inject             --checkpoint-out replay-source/llvm/hot-binfmt.chk.gz             --checkpoint-function load_flat_binary             --checkpoint-function-hit 1             --stop-after-checkpoint             --checkpoint-at-limit             --checkpoint-on-error             --max-steps 30000000             --progress-every 0             2>&1 | tee replay-source/llvm/prepare-init-hot.log
          status=${PIPESTATUS[0]}
          set -e
          echo "PREPARE_INIT_HOT_STATUS $status"
          grep -E 'BOOT_EXEC_(ROOTFS_INJECTED|PREPARE_NAMESPACE_SKIPPED|CHECKPOINT_RESTORED|CHECKPOINT_SAVED|CHECKPOINT_FUNCTION_PROGRESS|MILESTONE|PANIC_ENTER|BLOCKED|HALTED)' replay-source/llvm/prepare-init-hot.log | tail -n 320 || true
          test -s replay-source/llvm/hot-binfmt.chk.gz

      - name: Upload bFLT checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-prepare-init-hot-${{ github.run_id }}
          path: |
            replay-source/llvm/prepare-init-hot.log
            replay-source/llvm/hot-binfmt.chk.gz
            replay-source/llvm/hot-init.bflt
          if-no-files-found: ignore
          retention-days: 14
