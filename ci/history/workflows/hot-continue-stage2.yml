name: Linux MiniMachine Hot Continue Stage 2

on:
  workflow_run:
    workflows: ["Linux MiniMachine After PTY Hot Continue"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: minimachine-hot-continue-stage2
  cancel-in-progress: true

jobs:
  continue:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'work/checkpoint-after-kallsyms'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/checkpoint-after-kallsyms

      - name: Download previous hot checkpoint
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: minimachine-after-pty-next-${{ github.event.workflow_run.id }}
          path: previous-source

      - name: Download P3 program cache
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33249488447
          github-token: ${{ github.token }}
          name: minimachine-double-hot-33249488447
          path: p3-cache-source

      - name: Find matching Linux LLVM artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/linux-minimachine-boot.yml/runs?status=completed&per_page=30"               --jq '.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main") | .id' |
              head -n 1
          )"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download linked Linux LLVM image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: minimachine-linux-boot-*
          path: replay-source
          merge-multiple: true

      - name: Prepare hot inputs
        run: |
          checkpoint="$(find previous-source -name 'after-pty-next.chk.gz' -print -quit)"
          cache="$(find p3-cache-source -name 'linux-p3-cache.pkl.gz' -print -quit)"
          test -n "$checkpoint"
          test -n "$cache"
          test -s "$checkpoint"
          test -s "$cache"
          cp "$checkpoint" replay-source/llvm/hot-stage1.chk.gz
          cp "$cache" replay-source/llvm/linux-p3-cache.pkl.gz

      - name: Continue hot replay toward init_post
        run: |
          set +e
          set -o pipefail
          python3 scripts/run-minimachine-linux.py replay-source/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --program-cache-in replay-source/llvm/linux-p3-cache.pkl.gz             --checkpoint-in replay-source/llvm/hot-stage1.chk.gz             --checkpoint-out replay-source/llvm/hot-stage2.chk.gz             --checkpoint-function init_post             --checkpoint-function-hit 1             --stop-after-checkpoint             --checkpoint-at-limit             --max-steps 100000000             --progress-every 0             2>&1 | tee replay-source/llvm/hot-stage2.log
          status=${PIPESTATUS[0]}
          set -e
          echo "HOT_STAGE2_STATUS $status"
          grep -F 'BOOT_EXEC_PROGRAM_CACHE_LOADED' replay-source/llvm/hot-stage2.log
          grep -F 'BOOT_EXEC_CHECKPOINT_RESTORED' replay-source/llvm/hot-stage2.log
          test -s replay-source/llvm/hot-stage2.chk.gz
          tail -n 160 replay-source/llvm/hot-stage2.log

      - name: Upload stage-2 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-hot-stage2-${{ github.run_id }}
          path: |
            replay-source/llvm/hot-stage2.log
            replay-source/llvm/hot-stage2.chk.gz
          if-no-files-found: ignore
          retention-days: 14
