name: MiniMachine Shell Echo Cold Probe

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - .github/workflows/shell-echo-cold-probe.yml

permissions:
  contents: read
  actions: read

jobs:
  shell-echo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build native VM and echo initramfs
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared native/p3vm.c -o build/libminimachine_p3vm.so
          python3 scripts/build-minimachine-shell.py build/mmsh-echo.bflt --mode echo
          python3 scripts/build-minimachine-initramfs.py build/mmsh-echo.cpio \
            --init-image build/mmsh-echo.bflt \
            --init-output build/mmsh-echo-copy.bflt
          ls -lh build/mmsh-echo.bflt build/mmsh-echo.cpio

      - name: Download console-capable Linux image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33295701837
          github-token: ${{ github.token }}
          name: minimachine-linux-initramfs-33295701837
          path: console

      - name: Cold boot echo shell through Linux console
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          set -o pipefail
          printf 'hello\n' | \
          /usr/bin/time -f 'SHELL_ECHO_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          python3 scripts/run-minimachine-linux.py console/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in console/llvm/linux-initramfs-p3-cache.pkl.gz \
            --initramfs build/mmsh-echo.cpio \
            --native-vm \
            --native-boot-phases-only \
            --checkpoint-function kernel_execve \
            --checkpoint-function-hit 1 \
            --checkpoint-out build/mmsh-echo-kernel-execve.chk.gz \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee build/shell-echo.log

      - name: Assert real userspace read write echo path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("build/shell-echo.log").read_text(errors="replace")
          required = [
              "BOOT_EXEC_USER_HANDOFF ",
              "BOOT_EXEC_HOST_INPUT requested=128 returned=6",
              "BOOT_EXEC_HALTED",
              "SHELL_ECHO_WALL=",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"missing echo marker: {marker}")

          syscalls = [
              line for line in text.splitlines()
              if "BOOT_EXEC_USER_SYSCALL " in line
          ]
          writes = [line for line in syscalls if " nr=64 " in line]
          reads = [line for line in syscalls if " nr=63 " in line]
          if len(writes) < 3:
              raise SystemExit(f"expected >=3 writes, got {len(writes)}")
          if len(reads) < 2:
              raise SystemExit(f"expected >=2 reads, got {len(reads)}")
          if not any(" result=6" in line for line in reads):
              raise SystemExit("missing successful 6-byte stdin read")
          if not any(" result=0" in line for line in reads):
              raise SystemExit("missing EOF stdin read")
          if "mmsh> hello\nmmsh> " not in text:
              raise SystemExit("missing visible prompt/echo/prompt transcript")
          print("SHELL_ECHO_ASSERT_PASS")
          for line in syscalls:
              print(line)
          PY

      - name: Upload shell echo result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-shell-echo-${{ github.run_id }}
          path: |
            build/mmsh-echo.bflt
            build/mmsh-echo.cpio
            build/mmsh-echo-kernel-execve.chk.gz
            build/shell-echo.log
          if-no-files-found: ignore
          retention-days: 7
