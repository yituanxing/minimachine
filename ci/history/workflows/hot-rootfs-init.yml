name: Linux MiniMachine Hot Rootfs Init

on:
  push:
    branches: [work/checkpoint-after-kallsyms]
    paths:
      - .github/workflows/hot-rootfs-init.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  hot-init:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Download 592M checkpoint
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33259338414
          github-token: ${{ github.token }}
          name: minimachine-blake2s-fast-33259338414
          path: checkpoint-source

      - name: Download old-image P3 cache
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33249488447
          github-token: ${{ github.token }}
          name: minimachine-double-hot-33249488447
          path: p3-cache-source

      - name: Download old linked Linux image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33245921667
          github-token: ${{ github.token }}
          name: minimachine-linux-boot-33245921667
          path: replay-source

      - name: Build hot /init image
        run: |
          python3 scripts/build-minimachine-initramfs.py             replay-source/llvm/hot-initramfs.cpio             --init-output replay-source/llvm/hot-init.bflt
          test -s replay-source/llvm/hot-init.bflt

      - name: Prepare hot inputs
        run: |
          checkpoint="$(find checkpoint-source -name 'blake2s-fast-next.chk.gz' -print -quit)"
          cache="$(find p3-cache-source -name 'linux-p3-cache.pkl.gz' -print -quit)"
          test -n "$checkpoint"
          test -n "$cache"
          cp "$checkpoint" replay-source/llvm/hot-592m.chk.gz
          cp "$cache" replay-source/llvm/linux-p3-cache.pkl.gz

      - name: Inject /init and continue to binfmt_flat
        run: |
          set +e
          set -o pipefail
          python3 scripts/run-minimachine-linux.py replay-source/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --program-cache-in replay-source/llvm/linux-p3-cache.pkl.gz             --checkpoint-in replay-source/llvm/hot-592m.chk.gz             --inject-init replay-source/llvm/hot-init.bflt             --checkpoint-out replay-source/llvm/hot-init-next.chk.gz             --checkpoint-function load_flat_binary             --checkpoint-function-hit 1             --stop-after-checkpoint             --checkpoint-at-limit             --checkpoint-on-error             --max-steps 80000000             --progress-every 0             2>&1 | tee replay-source/llvm/hot-rootfs-init.log
          status=${PIPESTATUS[0]}
          set -e
          echo "HOT_ROOTFS_INIT_STATUS $status"
          grep -E 'BOOT_EXEC_(ROOTFS_INJECTED|CHECKPOINT_RESTORED|CHECKPOINT_SAVED|CHECKPOINT_FUNCTION_PROGRESS|MILESTONE|PANIC_ENTER|BLOCKED|HALTED)' replay-source/llvm/hot-rootfs-init.log | tail -n 260 || true
          test -s replay-source/llvm/hot-init-next.chk.gz

      - name: Upload hot init checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-hot-rootfs-init-${{ github.run_id }}
          path: |
            replay-source/llvm/hot-rootfs-init.log
            replay-source/llvm/hot-init-next.chk.gz
            replay-source/llvm/hot-init.bflt
            replay-source/llvm/hot-initramfs.cpio
          if-no-files-found: ignore
          retention-days: 14
