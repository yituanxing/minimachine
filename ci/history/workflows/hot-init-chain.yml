name: Linux MiniMachine Hot Init Chain

on:
  push:
    branches: [work/checkpoint-after-kallsyms]
    paths:
      - .github/workflows/hot-init-chain.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4

      - name: Wait for console checkpoint artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            count="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/33263981819/artifacts" --jq '.total_count')"
            if [ "$count" -gt 0 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "console checkpoint artifact did not appear" >&2
          exit 1

      - name: Download console checkpoint
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33263981819
          github-token: ${{ github.token }}
          name: minimachine-hot-console-33263981819
          path: checkpoint-source

      - name: Download old P3 cache
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33249488447
          github-token: ${{ github.token }}
          name: minimachine-double-hot-33249488447
          path: p3-cache-source

      - name: Download old linked image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33245921667
          github-token: ${{ github.token }}
          name: minimachine-linux-boot-33245921667
          path: replay-source

      - name: Build and prepare /init
        run: |
          python3 scripts/build-minimachine-initramfs.py             replay-source/llvm/hot-initramfs.cpio             --init-output replay-source/llvm/hot-init.bflt
          cp "$(find checkpoint-source -name 'hot-console.chk.gz' -print -quit)" replay-source/llvm/hot-console.chk.gz
          cp "$(find p3-cache-source -name 'linux-p3-cache.pkl.gz' -print -quit)" replay-source/llvm/linux-p3-cache.pkl.gz

      - name: Inject and continue to bFLT loader
        run: |
          set +e
          set -o pipefail
          python3 scripts/run-minimachine-linux.py replay-source/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --program-cache-in replay-source/llvm/linux-p3-cache.pkl.gz             --checkpoint-in replay-source/llvm/hot-console.chk.gz             --inject-init replay-source/llvm/hot-init.bflt             --checkpoint-out replay-source/llvm/hot-binfmt.chk.gz             --checkpoint-function load_flat_binary             --checkpoint-function-hit 1             --stop-after-checkpoint             --checkpoint-at-limit             --checkpoint-on-error             --max-steps 20000000             --progress-every 0             2>&1 | tee replay-source/llvm/hot-init-chain.log
          status=${PIPESTATUS[0]}
          set -e
          echo "HOT_INIT_CHAIN_STATUS $status"
          grep -E 'BOOT_EXEC_(ROOTFS_INJECTED|CHECKPOINT_RESTORED|CHECKPOINT_SAVED|CHECKPOINT_FUNCTION_PROGRESS|MILESTONE|PANIC_ENTER|BLOCKED|HALTED)' replay-source/llvm/hot-init-chain.log | tail -n 260 || true
          test -s replay-source/llvm/hot-binfmt.chk.gz

      - name: Upload bFLT checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-hot-binfmt-${{ github.run_id }}
          path: |
            replay-source/llvm/hot-init-chain.log
            replay-source/llvm/hot-binfmt.chk.gz
            replay-source/llvm/hot-init.bflt
          if-no-files-found: ignore
          retention-days: 14
