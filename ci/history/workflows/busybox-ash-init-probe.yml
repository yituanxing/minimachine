name: MiniMachine BusyBox Ash Init Probe

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - .github/workflows/busybox-ash-init-probe.yml

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared             native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download exact Linux image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33295701837
          github-token: ${{ github.token }}
          name: minimachine-linux-initramfs-33295701837
          path: console

      - name: Download proven kernel_execve checkpoint
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33296957158
          github-token: ${{ github.token }}
          name: minimachine-shell-echo-33296957158
          path: echo

      - name: Download frozen ash carrier
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33302954924
          github-token: ${{ github.token }}
          name: minimachine-busybox-ash-carrier-33302954924
          path: ash

      - name: Probe run_init_process errno
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          set -o pipefail
          /usr/bin/time -f 'ASH_INIT_PROBE_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M'           python3 scripts/run-minimachine-linux.py console/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --program-cache-in console/llvm/linux-initramfs-p3-cache.pkl.gz             --initramfs echo/mmsh-echo.cpio             --native-vm             --checkpoint-in echo/mmsh-echo-kernel-execve.chk.gz             --inject-init ash/busybox-ash-first.bflt             --probe-run-init-after-checkpoint             --stop-on-panic             --max-steps 0             --progress-every 0             2>&1 | tee build/ash-init-probe.log

      - name: Assert probe reached exec result
        run: |
          grep -F 'BOOT_EXEC_ROOTFS_INJECTED path=/init' build/ash-init-probe.log
          grep -F 'BOOT_EXEC_INIT_EXEC_PROBE path=/init result=' build/ash-init-probe.log
          grep -F 'ASH_INIT_PROBE_WALL=' build/ash-init-probe.log

      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-busybox-ash-init-probe-${{ github.run_id }}
          path: build/ash-init-probe.log
          retention-days: 7
