name: SQLite VFS Kernel Surface

on:
  workflow_dispatch:
  push:
    branches: [work/sqlite-real-software]
    paths:
      - .github/workflows/sqlite-vfs-kernel-surface.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download exact qualified Linux image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33632628029
          github-token: ${{ github.token }}
          name: minimachine-linux-initramfs-33632628029
          path: linux
      - name: Inspect VFS syscall wrappers
        run: |
          test -s linux/llvm/linked.ll
          grep -nE '^define .*@(__se_sys_(newfstat|fstat|fsync|ftruncate|pread64|pwrite64|mmap|munmap|unlinkat|mkdirat|readlinkat|symlinkat|fchmodat|fchmod|fchown))\(' \
            linux/llvm/linked.ll | tee vfs-symbols.txt || true
          echo VFS_KERNEL_SURFACE_COUNT=$(wc -l < vfs-symbols.txt)
          test -s vfs-symbols.txt
