name: MiniMachine xxreadtoken Native Move Probe

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - .github/workflows/xxreadtoken-native-move-probe.yml

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download BusyBox multicall image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33396890631
          github-token: ${{ github.token }}
          name: minimachine-busybox-multicall-33396890631
          path: busybox

      - name: Execute exact xxreadtoken block 19 prefix
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from src.minimachine.native_vm import NativeVM
          from src.minimachine.user_image import BFLT_HEADER_SIZE, unpack_user_image
          from src.minimachine.vm import Program

          blob = Path("busybox/busybox-multicall.bflt").read_bytes()
          data_start = int.from_bytes(blob[12:16], "big")
          image = unpack_user_image(blob[BFLT_HEADER_SIZE:data_start])
          fn = next(f for f in image.functions if f.name == "__mm_user_xxreadtoken")
          program = Program((fn,))

          for obj in image.image.objects:
              if obj.name in {"__mm_user_xxreadtoken_chars", "__mm_user_xxreadtoken_tokens"}:
                  program.define_data_symbol(obj.name, obj.data, align=obj.align)

          vm = NativeVM(program)
          linked = program.functions["__mm_user_xxreadtoken"]
          sp = 0x02000000
          chars = program.symbol_addresses["__mm_user_xxreadtoken_chars"]
          src_off = linked.slot_offsets["17"]
          dst_off = linked.slot_offsets["37"]
          vm.memory.write(sp + src_off, 64, chars)

          code = program.block_code[("__mm_user_xxreadtoken", "19")]
          vm._lib.mm_vm_set_state(vm._handle, code, 0, sp, 0)
          before_src = vm.memory.read(sp + src_off, 64)
          before_dst = vm.memory.read(sp + dst_off, 64)
          result = vm._lib.mm_vm_run(vm._handle, 4)
          after_src = vm.memory.read(sp + src_off, 64)
          after_dst = vm.memory.read(sp + dst_off, 64)

          print(
              "XXREADTOKEN_MOVE_PROBE "
              f"chars=0x{chars:x} src_off={src_off} dst_off={dst_off} "
              f"before_src=0x{before_src:x} before_dst=0x{before_dst:x} "
              f"after_src=0x{after_src:x} after_dst=0x{after_dst:x} "
              f"status={result.status} steps={result.steps} ip={result.ip}"
          )
          if after_dst != chars:
              raise SystemExit(
                  f"I64 slot move truncated: expected 0x{chars:x}, got 0x{after_dst:x}"
              )
          print("XXREADTOKEN_MOVE_PROBE_PASS")
          PY
