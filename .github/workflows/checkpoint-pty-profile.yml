name: Linux MiniMachine PTY Hot Profile

on:
  push:
    branches: [work/checkpoint-after-kallsyms]
    paths:
      - .github/workflows/checkpoint-pty-profile.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: minimachine-checkpoint-pty-profile
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Download pty-entry checkpoint
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33248074874
          github-token: ${{ github.token }}
          name: minimachine-linux-replay-33248074874
          path: checkpoint-source

      - name: Find matching Linux LLVM artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/linux-minimachine-boot.yml/runs?status=completed&per_page=30"               --jq '.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main") | .id' |
              head -n 1
          )"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download linked Linux LLVM image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: minimachine-linux-boot-*
          path: replay-source
          merge-multiple: true

      - name: Prepare checkpoint
        run: |
          checkpoint="$(find checkpoint-source -name 'pty-init.chk.gz' -print -quit)"
          test -n "$checkpoint"
          cp "$checkpoint" replay-source/llvm/pty-init.chk.gz

      - name: Sample 30M P3 steps inside pty_init
        run: |
          set +e
          set -o pipefail
          python3 scripts/run-minimachine-linux.py replay-source/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --checkpoint-in replay-source/llvm/pty-init.chk.gz             --checkpoint-initcall pty_init             --max-steps 30000000             --progress-every 1000000             2>&1 | tee replay-source/llvm/pty-profile.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 1
          grep -F 'BOOT_EXEC_CHECKPOINT_RESTORED' replay-source/llvm/pty-profile.log
          grep -F 'BOOT_EXEC_PROGRESS' replay-source/llvm/pty-profile.log | tail -n 40

      - name: Upload PTY profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-pty-profile-${{ github.run_id }}
          path: replay-source/llvm/pty-profile.log
          if-no-files-found: ignore
          retention-days: 14
