name: MiniMachine BusyBox Real Software Hot

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - scripts/run-minimachine-linux.py
      - src/minimachine/native_vm.py
      - src/minimachine/runtime.py
      - src/minimachine/vm.py
      - scripts/build-user-image-cache.py
      - src/minimachine/user_image_cache.py
      - linux-overlay/arch/minimachine/**
      - scripts/build-minimachine-initramfs.py
      - scripts/check-minimachine-boot.sh
      - .github/workflows/initramfs-build.yml
      - .github/workflows/refresh-console-p3-cache.yml
      - .github/workflows/busybox-multicall-cold.yml
      - .github/workflows/busybox-real-hot.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: busybox-real-hot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-hot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared \
            native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Find generation-matched real BusyBox cold checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cold
          lowering_sha="$(git log -1 --format=%H -- \
            src/minimachine/program_cache.py \
            src/minimachine/llvm_text.py \
            src/minimachine/layout.py \
            src/minimachine/legalize.py \
            src/minimachine/abi.py \
            src/minimachine/lower_p3.py \
            src/minimachine/muir.py \
            src/minimachine/p3.py \
            src/minimachine/verify.py \
            src/minimachine/image.py)"
          linux_sha="$(git log -1 --format=%H -- \
            linux-overlay/arch/minimachine \
            scripts/build-minimachine-initramfs.py \
            scripts/check-minimachine-boot.sh \
            .github/workflows/initramfs-build.yml)"
          native_pack_sha="$(git log -1 --format=%H -- \
            src/minimachine/native_vm.py \
            src/minimachine/runtime.py \
            src/minimachine/vm.py \
            scripts/run-minimachine-linux.py)"
          test -n "$lowering_sha"
          test -n "$linux_sha"
          test -n "$native_pack_sha"

          found=""
          for attempt in $(seq 1 60); do
            for run_id in $(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow busybox-multicall-cold.yml \
              --branch work/native-p3-vm \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId'); do
              rm -rf cold/*
              if ! gh run download "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --name "minimachine-busybox-real-cold-$run_id" \
                --dir cold >/dev/null 2>&1; then
                continue
              fi
              test -s cold/input-runs.env || continue
              test -s cold/busybox-real-init.cpio || continue
              test -s cold/busybox-real-kernel-execve.chk.gz || continue
              cold_lowering="$(sed -n 's/^LOWERING_SHA=//p' cold/input-runs.env)"
              cold_linux="$(sed -n 's/^LINUX_SHA=//p' cold/input-runs.env)"
              if [ "$cold_lowering" = "$lowering_sha" ] && \
                 [ "$cold_linux" = "$linux_sha" ]; then
                found="$run_id"
                break
              fi
            done
            if [ -n "$found" ]; then
              break
            fi
            echo "waiting for generation-matched BusyBox cold attempt=$attempt lowering=$lowering_sha linux=$linux_sha native_pack=$native_pack_sha"
            sleep 10
          done
          test -n "$found"
          echo "BUSYBOX_COLD_RUN_ID=$found" | tee build/hot-inputs.env
          cat cold/input-runs.env | tee -a build/hot-inputs.env

      - name: Download exact Linux, P3 cache, and BusyBox bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -a
          . build/hot-inputs.env
          set +a

          test -n "$P3_REFRESH_RUN_ID"
          test -n "$LINUX_RUN_ID"
          test -n "$BUSYBOX_RUN_ID"

          gh run download "$P3_REFRESH_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-linux-p3-console-current-$P3_REFRESH_RUN_ID" \
            --dir current-cache

          gh run download "$LINUX_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-linux-initramfs-$LINUX_RUN_ID" \
            --dir linux

          gh run download "$BUSYBOX_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-busybox-multicall-$BUSYBOX_RUN_ID" \
            --dir busybox

          test -s current-cache/linux-initramfs-p3-cache-full-current.pkl.gz
          test -s linux/llvm/linked.ll
          test -s busybox/busybox-multicall.bflt

      - name: Prewarm native packed image when cold artifact is legacy
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
          MINIMACHINE_DISABLE_GC: "1"
        run: |
          if [ -s cold/busybox-real-native-pack.bin ]; then
            echo "NATIVE_PACK_PREWARM=artifact-hit"
            exit 0
          fi
          set -o pipefail
          /usr/bin/time -f 'NATIVE_PACK_PREWARM_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in current-cache/linux-initramfs-p3-cache-full-current.pkl.gz \
            --initramfs cold/busybox-real-init.cpio \
            --native-vm \
            --native-pack-cache-out cold/busybox-real-native-pack.bin \
            --checkpoint-in cold/busybox-real-kernel-execve.chk.gz \
            --max-steps 1 \
            --progress-every 0 \
            2>&1 | tee build/native-pack-prewarm.log
          test -s cold/busybox-real-native-pack.bin
          grep -F 'BOOT_EXEC_NATIVE_PACK_CACHE_SAVED ' build/native-pack-prewarm.log

      - name: Build trusted BusyBox userspace image cache
        run: |
          /usr/bin/time -f 'BUSYBOX_USER_CACHE_BUILD_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
            python3 scripts/build-user-image-cache.py \
              busybox/busybox-multicall.bflt \
              build/busybox-user-image.pkl

      - name: Prewarm BusyBox native append segments
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
          MINIMACHINE_USER_IMAGE_REFERENCE: ${{ github.workspace }}/busybox/busybox-multicall.bflt
          MINIMACHINE_USER_IMAGE_CACHE: ${{ github.workspace }}/build/busybox-user-image.pkl
          MINIMACHINE_DISABLE_GC: "1"
        run: |
          rm -rf build/native-append-pack-cache
          mkdir -p build/native-append-pack-cache
          set -o pipefail
          set +e
          echo 'exit' | \
          /usr/bin/time -f 'NATIVE_APPEND_PREWARM_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          timeout --signal=TERM 240 \
          python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in current-cache/linux-initramfs-p3-cache-full-current.pkl.gz \
            --initramfs cold/busybox-real-init.cpio \
            --native-vm \
            --native-pack-cache-in cold/busybox-real-native-pack.bin \
            --native-append-pack-cache-out-dir build/native-append-pack-cache \
            --checkpoint-in cold/busybox-real-kernel-execve.chk.gz \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee build/native-append-prewarm.log
          status=${PIPESTATUS[1]}
          set -e
          echo "NATIVE_APPEND_PREWARM_STATUS=$status"
          test -s build/native-append-pack-cache/append-000.bin
          test -s build/native-append-pack-cache/append-001.bin
          test "$(grep -c 'BOOT_EXEC_NATIVE_APPEND_CACHE_SAVED ' build/native-append-prewarm.log)" -ge 2

      - name: Replay real BusyBox init and shell
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
          MINIMACHINE_USER_IMAGE_REFERENCE: ${{ github.workspace }}/busybox/busybox-multicall.bflt
          MINIMACHINE_USER_IMAGE_CACHE: ${{ github.workspace }}/build/busybox-user-image.pkl
          MINIMACHINE_DISABLE_GC: "1"
        run: |
          set -o pipefail
          set +e
          {
            echo 'echo MINIMACHINE_REAL_EXTERNAL_BEGIN'
            echo '/bin/uname -s'
            echo '/bin/ls /etc'
            echo '/bin/cat /etc/inittab'
            echo 'echo MINIMACHINE_REAL_EXTERNAL_END'
            echo 'exit'
          } | \
          /usr/bin/time -f 'BUSYBOX_HOT_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          timeout --signal=TERM 540 \
          python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in current-cache/linux-initramfs-p3-cache-full-current.pkl.gz \
            --initramfs cold/busybox-real-init.cpio \
            --native-vm \
            --native-pack-cache-in cold/busybox-real-native-pack.bin \
            --native-append-pack-cache-in-dir build/native-append-pack-cache \
            --checkpoint-in cold/busybox-real-kernel-execve.chk.gz \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee build/busybox-hot.log
          status=${PIPESTATUS[1]}
          set -e
          echo "BUSYBOX_HOT_STATUS=$status" | tee -a build/busybox-hot.log

      - name: Report BusyBox hot frontier
        if: always()
        run: |
          cat build/hot-inputs.env || true
          grep -E 'BOOT_EXEC_(CHECKPOINT_RESTORED|USER_HANDOFF|USER_EXTERNAL|USER_SYSCALL|USER_FORK|USER_EXIT|BLOCKED|HALTED)|MINIMACHINE_REAL_|BUSYBOX_HOT_' \
            build/busybox-hot.log | tail -700 || true

          if grep -F 'BOOT_EXEC_BLOCKED ' build/busybox-hot.log >/dev/null; then
            echo BUSYBOX_HOT_FRONTIER=blocked
            grep -F 'BOOT_EXEC_BLOCKED ' build/busybox-hot.log | tail -1
          elif grep -Fx 'MINIMACHINE_REAL_EXTERNAL_END' build/busybox-hot.log >/dev/null; then
            echo BUSYBOX_HOT_FRONTIER=external-software-passed
          else
            echo BUSYBOX_HOT_FRONTIER=before-external-software-end
          fi

      - name: Assert real BusyBox frontier
        run: |
          grep -F 'BOOT_EXEC_NATIVE_PACK_CACHE_LOADED ' build/busybox-hot.log
          test "$(grep -c 'BOOT_EXEC_NATIVE_APPEND_CACHE_LOADED ' build/busybox-hot.log)" -ge 2
          grep -F 'BOOT_EXEC_CHECKPOINT_RESTORED ' build/busybox-hot.log
          for pattern in \
            'program cache lowering fingerprint mismatch' \
            'checkpoint image fingerprint mismatch' \
            'BOOT_EXEC_BLOCKED '; do
            if grep -F "$pattern" build/busybox-hot.log >/dev/null; then
              echo "unexpected BusyBox hot failure marker: $pattern"
              grep -F "$pattern" build/busybox-hot.log | tail -1
              exit 1
            fi
          done
          grep -Fx 'MINIMACHINE_REAL_EXTERNAL_END' build/busybox-hot.log

      - name: Upload BusyBox hot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-busybox-real-hot-${{ github.run_id }}
          path: |
            build/hot-inputs.env
            build/busybox-hot.log
          if-no-files-found: warn
          retention-days: 7
