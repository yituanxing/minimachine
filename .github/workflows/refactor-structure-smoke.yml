name: MiniMachine Structure Refactor Smoke

on:
  push:
    branches: [refactor/project-structure]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python sources
        run: python3 -m compileall -q src scripts tests
      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared native/p3vm.c -o build/libminimachine_p3vm.so
      - name: Run unit tests
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: python3 -m unittest discover -s tests -p 'test_*.py'
