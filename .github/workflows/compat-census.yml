name: MiniMachine Compatibility Census

on:
  workflow_dispatch:
  push:
    branches: [work/sqlite-real-software]
    paths:
      - scripts/minimachine-compat-census.py
      - scripts/scan-sqlite-external-surface.py
      - scripts/run-minimachine-linux.py
      - scripts/run-minimachine-linux-pipe.py
      - scripts/run-minimachine-linux-forkstack.py
      - tests/test_minimachine_compat_census.py
      - tests/test_system_surface.py
      - tests/test_pthread_mutex_surface.py
      - .github/workflows/compat-census.yml
      - src/minimachine/pthread_surface.py
      - src/minimachine/system_surface.py
      - src/minimachine/user_image.py
      - src/minimachine/user_bundle.py

permissions:
  actions: read
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run compatibility contract unit tests
        run: |
          PYTHONPATH=. python3 tests/test_minimachine_compat_census.py
          PYTHONPATH=. python3 tests/test_system_surface.py
          PYTHONPATH=. python3 tests/test_pthread_mutex_surface.py

      - name: Download proven SQLite bundle
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 34689448761
          github-token: ${{ github.token }}
          name: minimachine-sqlite3534-34689448761
          path: sqlite

      - name: Download frozen BusyBox bundle
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33396890631
          github-token: ${{ github.token }}
          name: minimachine-busybox-multicall-33396890631
          path: busybox

      - name: Census real software bundles
        run: |
          mkdir -p build
          python3 scripts/minimachine-compat-census.py \
            busybox/busybox-multicall.bflt \
            sqlite/sqlite3534.bflt \
            | tee build/compat-census.log

      - name: Scan SQLite external surface
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          import sys

          path = Path('scripts/minimachine-compat-census.py')
          spec = importlib.util.spec_from_file_location('mm_compat_census', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          census = module.census_bflt(Path('sqlite/sqlite3534.bflt'))
          Path('build/sqlite-census.json').write_text(json.dumps({
              'external_functions': [x.rsplit('_ext_', 1)[-1] for x in census.external_functions],
              'external_data': list(census.external_data),
          }, indent=2, sort_keys=True) + '\n')
          PY
          python3 scripts/scan-sqlite-external-surface.py build/sqlite-census.json \
            | tee build/sqlite-external-surface.log

      - name: Prove generic surface before runtime
        run: |
          grep -F 'path=sqlite/sqlite3534.bflt descriptor=__mm_sys_fence inferred_op=fence state=runtime-resolvable' build/compat-census.log
          grep -F 'MMCOMPAT_RESULT=PASS' build/compat-census.log
          if grep -E 'SQLITE_EXTERNAL_UNSUPPORTED pthread_mutex(attr)?_' build/sqlite-external-surface.log; then
            echo 'pthread mutex family still has unsupported members' >&2
            exit 1
          fi
          grep -F 'SQLITE_EXTERNAL_UNSUPPORTED pthread_create' build/sqlite-external-surface.log
          grep -F 'SQLITE_EXTERNAL_UNSUPPORTED pthread_join' build/sqlite-external-surface.log

      - name: Upload census evidence
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-compat-census-${{ github.run_id }}
          path: |
            build/compat-census.log
            build/sqlite-census.json
            build/sqlite-external-surface.log
          if-no-files-found: error
          retention-days: 7
