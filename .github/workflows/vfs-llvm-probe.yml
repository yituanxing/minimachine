name: MiniMachine VFS LLVM Probe

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - .github/workflows/vfs-llvm-probe.yml

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download old linked image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33245921667
          github-token: ${{ github.token }}
          name: minimachine-linux-boot-33245921667
          path: replay-source
      - name: Extract VFS LLVM functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path("replay-source/llvm/linked.ll").read_text()
          for name in ["open_last_lookups","lookup_open","path_openat"]:
              start=text.find(f"define internal ")
              # robustly find exact definition by scanning lines
              lines=text.splitlines()
              out=[]
              active=False
              depth=0
              for line in lines:
                  if not active and line.startswith("define ") and f"@{name}(" in line:
                      active=True
                  if active:
                      out.append(line)
                      if line.strip()=="{" or line.rstrip().endswith("{"):
                          depth+=1
                      if line.strip()=="}":
                          break
              print(f"===== {name} =====")
              print("\n".join(out))
          PY
