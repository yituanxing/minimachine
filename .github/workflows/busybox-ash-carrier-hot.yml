name: MiniMachine Ash Carrier Hot

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - native/p3vm.c
      - src/minimachine/native_vm.py
      - src/minimachine/runtime.py
      - src/minimachine/vm.py
      - src/minimachine/program_cache.py
      - scripts/run-minimachine-linux.py
      - .github/workflows/busybox-multicall-cold.yml
      - .github/workflows/busybox-ash-carrier-hot.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: ash-carrier-hot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ash-hot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared \
            native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Find generation-matched real BusyBox cold checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cold
          lowering_sha="$(git log -1 --format=%H -- \
            src/minimachine/program_cache.py \
            src/minimachine/llvm_text.py \
            src/minimachine/layout.py \
            src/minimachine/legalize.py \
            src/minimachine/abi.py \
            src/minimachine/lower_p3.py \
            src/minimachine/muir.py \
            src/minimachine/p3.py \
            src/minimachine/verify.py \
            src/minimachine/image.py)"
          linux_sha="$(git log -1 --format=%H -- \
            linux-overlay/arch/minimachine \
            scripts/build-minimachine-initramfs.py \
            scripts/check-minimachine-boot.sh \
            .github/workflows/initramfs-build.yml)"
          native_pack_sha="$(git log -1 --format=%H -- \
            src/minimachine/native_vm.py \
            src/minimachine/runtime.py \
            src/minimachine/vm.py \
            scripts/run-minimachine-linux.py)"
          test -n "$lowering_sha"
          test -n "$linux_sha"
          test -n "$native_pack_sha"

          found=""
          for attempt in $(seq 1 60); do
            for run_id in $(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow busybox-multicall-cold.yml \
              --branch work/native-p3-vm \
              --status success \
              --limit 30 \
              --json databaseId,status,conclusion \
              --jq '.[].databaseId'); do
              rm -rf candidate-manifest
              if ! gh run download "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --name "minimachine-busybox-real-cold-manifest-$run_id" \
                --dir candidate-manifest >/dev/null 2>&1; then
                continue
              fi
              test -s candidate-manifest/input-runs.env || continue
              cold_lowering="$(sed -n 's/^LOWERING_SHA=//p' candidate-manifest/input-runs.env)"
              cold_linux="$(sed -n 's/^LINUX_SHA=//p' candidate-manifest/input-runs.env)"
              cold_native_pack="$(sed -n 's/^NATIVE_PACK_SHA=//p' candidate-manifest/input-runs.env)"
              if [ "$cold_lowering" = "$lowering_sha" ] && \
                 [ "$cold_linux" = "$linux_sha" ] && \
                 [ "$cold_native_pack" = "$native_pack_sha" ]; then
                found="$run_id"
                break
              fi
            done
            if [ -n "$found" ]; then
              break
            fi
            echo "waiting for generation-matched cold manifest attempt=$attempt lowering=$lowering_sha linux=$linux_sha native_pack=$native_pack_sha"
            sleep 10
          done
          test -n "$found"

          bundle_ready=""
          for attempt in $(seq 1 60); do
            rm -rf cold
            if gh run download "$found" \
              --repo "$GITHUB_REPOSITORY" \
              --name "minimachine-busybox-real-cold-$found" \
              --dir cold >/dev/null 2>&1; then
              if [ -s cold/input-runs.env ] && \
                 [ -s cold/busybox-real-init.cpio ] && \
                 [ -s cold/busybox-real-kernel-execve.chk.gz ] && \
                 [ -s cold/busybox-real-native-pack.bin ] && \
                 [ -s cold/linux-native-hot-cache.pkl.gz ]; then
                bundle_ready=1
                break
              fi
            fi
            echo "waiting for complete cold bundle run=$found attempt=$attempt"
            sleep 10
          done
          test -n "$bundle_ready"

          test -s cold/input-runs.env
          test -s cold/busybox-real-init.cpio
          test -s cold/busybox-real-kernel-execve.chk.gz
          test -s cold/busybox-real-native-pack.bin
          test -s cold/linux-native-hot-cache.pkl.gz
          echo "ASH_COLD_RUN_ID=$found" | tee build/ash-hot-inputs.env
          cat cold/input-runs.env | tee -a build/ash-hot-inputs.env

      - name: Download exact Linux and BusyBox bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -a
          . build/ash-hot-inputs.env
          set +a
          test -n "$LINUX_RUN_ID"
          test -n "$BUSYBOX_RUN_ID"

          gh run download "$LINUX_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-linux-initramfs-$LINUX_RUN_ID" \
            --dir linux

          gh run download "$BUSYBOX_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-busybox-multicall-$BUSYBOX_RUN_ID" \
            --dir busybox

          test -s linux/llvm/linked.ll
          test -s busybox/busybox-multicall.bflt

      - name: Continue real BusyBox ash from first exec
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
          MINIMACHINE_USER_IMAGE_REFERENCE: ${{ github.workspace }}/busybox/busybox-multicall.bflt
          MINIMACHINE_DISABLE_GC: "1"
        run: |
          set -o pipefail
          set +e
          printf 'echo BUSYBOX_MINIMACHINE_HELLO\nvalue=42\necho BUSYBOX_VAR_$value\nfalse\necho BUSYBOX_FALSE_STATUS_$?\nexit 0\n' | \
          /usr/bin/time -f 'ASH_CARRIER_HOT_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          timeout --signal=TERM 420 \
          python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --native-hot-cache-in cold/linux-native-hot-cache.pkl.gz \
            --initramfs cold/busybox-real-init.cpio \
            --native-vm \
            --native-pack-cache-in cold/busybox-real-native-pack.bin \
            --checkpoint-in cold/busybox-real-kernel-execve.chk.gz \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee build/ash-carrier-hot.log
          status=${PIPESTATUS[1]}
          set -e
          echo "ASH_CARRIER_HOT_STATUS=$status" | tee -a build/ash-carrier-hot.log

      - name: Assert real ash semantics
        run: |
          grep -F 'BOOT_EXEC_CHECKPOINT_RESTORED ' build/ash-carrier-hot.log
          grep -Fx 'MINIMACHINE_REAL_BUSYBOX_RCS' build/ash-carrier-hot.log
          grep -Fx 'BUSYBOX_MINIMACHINE_HELLO' build/ash-carrier-hot.log
          grep -Fx 'BUSYBOX_VAR_42' build/ash-carrier-hot.log
          grep -Fx 'BUSYBOX_FALSE_STATUS_1' build/ash-carrier-hot.log
          grep -Fx 'ASH_CARRIER_HOT_STATUS=0' build/ash-carrier-hot.log
          for pattern in \
            'program cache lowering fingerprint mismatch' \
            'checkpoint image fingerprint mismatch' \
            'BOOT_EXEC_BLOCKED '; do
            if grep -F "$pattern" build/ash-carrier-hot.log >/dev/null; then
              echo "unexpected ash hot failure marker: $pattern"
              grep -F "$pattern" build/ash-carrier-hot.log | tail -1
              exit 1
            fi
          done

      - name: Summarize real ash path
        if: always()
        run: |
          cat build/ash-hot-inputs.env || true
          grep -E 'BOOT_EXEC_(CHECKPOINT_RESTORED|USER_HANDOFF|USER_EXTERNAL|USER_SYSCALL|USER_EXIT|BLOCKED|HALTED)|MINIMACHINE_REAL_BUSYBOX_RCS|BUSYBOX_(MINIMACHINE_HELLO|VAR_42|FALSE_STATUS_1)|ASH_CARRIER_HOT_(WALL|STATUS)' \
            build/ash-carrier-hot.log | tail -420 || true

      - name: Upload hot trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-ash-carrier-hot-${{ github.run_id }}
          path: |
            build/ash-hot-inputs.env
            build/ash-carrier-hot.log
          if-no-files-found: warn
          retention-days: 14
