name: MiniMachine Ash Carrier Hot

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - native/p3vm.c
      - src/minimachine/native_vm.py
      - src/minimachine/runtime.py
      - scripts/run-minimachine-linux.py
      - .github/workflows/busybox-ash-carrier-hot.yml

permissions:
  contents: read
  actions: read

jobs:
  ash-hot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared \
            native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download exact Linux image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33295701837
          github-token: ${{ github.token }}
          name: minimachine-linux-initramfs-33295701837
          path: console

      - name: Download proven kernel_execve checkpoint
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33296957158
          github-token: ${{ github.token }}
          name: minimachine-shell-echo-33296957158
          path: echo

      - name: Download frozen ash carrier
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33302954924
          github-token: ${{ github.token }}
          name: minimachine-busybox-ash-carrier-33302954924
          path: ash

      - name: Hot-run frozen ash carrier
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          set -o pipefail
          set +e
          printf 'echo BUSYBOX_MINIMACHINE_HELLO\nexit\n' | \
          /usr/bin/time -f 'ASH_CARRIER_HOT_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          timeout --signal=TERM 180 \
          python3 scripts/run-minimachine-linux.py console/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in console/llvm/linux-initramfs-p3-cache.pkl.gz \
            --initramfs echo/mmsh-echo.cpio \
            --native-vm \
            --checkpoint-in echo/mmsh-echo-kernel-execve.chk.gz \
            --inject-init ash/busybox-ash-first.bflt \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 1000000 \
            2>&1 | tee build/ash-carrier-hot.log
          status=${PIPESTATUS[1]}
          set -e
          echo "ASH_CARRIER_HOT_STATUS=$status" | tee -a build/ash-carrier-hot.log

      - name: Summarize real ash path
        if: always()
        run: |
          grep -E 'BOOT_EXEC_(PROGRAM_CACHE_LOADED|STAGE|NATIVE_PACK|HOST_BULK_WRITE|ROOTFS_INJECTED|CHECKPOINT_RESTORED|USER_RUNTIME|USER_EXTERNAL_SURFACE|USER_EXTERNAL_DATA|USER_IMAGE_DATA|USER_ARGS|USER_HANDOFF|NATIVE_APPEND_PACK|NATIVE_APPEND|NATIVE_HOST_APPEND|NATIVE_DATA_APPEND|USER_EXTERNAL|USER_SYSCALL|HOST_INPUT|USER_READ_BUFFER|BLOCKED|HALTED)|BOOT_EXEC_INIT_EXEC_PROBE|BUSYBOX_MINIMACHINE_HELLO|ASH_CARRIER_HOT_(WALL|STATUS)|(^| )[/#] ' \
            build/ash-carrier-hot.log | tail -360 || true

      - name: Upload hot trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-ash-carrier-hot-${{ github.run_id }}
          path: build/ash-carrier-hot.log
          if-no-files-found: error
          retention-days: 14
