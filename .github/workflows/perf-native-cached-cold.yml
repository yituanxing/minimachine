name: MiniMachine Native Cached Cold Boot

on:
  push:
    branches: [research/native-cold-cache]
    paths:
      - .github/workflows/perf-native-cached-cold.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cached-cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P3_REFRESH_RUN_ID: "34036739708"
      MINIMACHINE_DISABLE_GC: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared \
            native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download generation-matched P3 cache and Linux image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p current-cache linux
          gh run download "$P3_REFRESH_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-linux-p3-console-current-$P3_REFRESH_RUN_ID" \
            --dir current-cache
          . current-cache/input-run.env
          gh run download "$LINUX_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-linux-initramfs-$LINUX_RUN_ID" \
            --dir linux
          test -s current-cache/linux-initramfs-p3-cache-full-current.pkl.gz
          test -s linux/llvm/linked.ll
          test -s linux/out/minimachine-initramfs.cpio

      - name: Prewarm native packed image
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          set +e
          python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in current-cache/linux-initramfs-p3-cache-full-current.pkl.gz \
            --initramfs linux/out/minimachine-initramfs.cpio \
            --native-vm \
            --native-pack-cache-out build/native-pack.bin \
            --max-steps 1 \
            --progress-every 0 \
            > build/prewarm.log 2>&1
          status=$?
          set -e
          echo "CACHED_COLD_PREWARM_STATUS=$status"
          test -s build/native-pack.bin
          grep -F 'BOOT_EXEC_NATIVE_PACK_CACHE_SAVED ' build/prewarm.log

      - name: Run cached cold boot from start_kernel
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          set -o pipefail
          /usr/bin/time -f 'CACHED_COLD_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in current-cache/linux-initramfs-p3-cache-full-current.pkl.gz \
            --initramfs linux/out/minimachine-initramfs.cpio \
            --native-vm \
            --native-pack-cache-in build/native-pack.bin \
            --native-boot-phases-only \
            --native-report-every 50000000 \
            --stop-after-user-handoff \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee build/cached-cold.log

      - name: Assert cached cold boot
        run: |
          grep -F 'BOOT_EXEC_NATIVE_PACK_CACHE_LOADED ' build/cached-cold.log
          grep -F 'BOOT_EXEC_USER_HANDOFF ' build/cached-cold.log
          grep -F 'BOOT_EXEC_STAGE stage=execute-end ' build/cached-cold.log
          grep -F 'CACHED_COLD_WALL=' build/cached-cold.log
          ! grep -F 'BOOT_EXEC_BLOCKED ' build/cached-cold.log

      - name: Upload cached cold result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-native-cached-cold-${{ github.run_id }}
          path: |
            build/cached-cold.log
            build/prewarm.log
          if-no-files-found: warn
          retention-days: 7
