name: Linux MiniMachine Native C Cold Smoke

on:
  push:
    branches: [work/native-p3-vm]
    paths:
      - native/**
      - src/minimachine/native_vm.py
      - scripts/run-minimachine-linux.py
      - .github/workflows/native-c-cold-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build native P3 VM
        run: |
          mkdir -p build
          gcc -O3 -std=c11 -fPIC -shared native/p3vm.c -o build/libminimachine_p3vm.so
          ls -lh build/libminimachine_p3vm.so

      - name: Download linked Linux image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33245921667
          github-token: ${{ github.token }}
          name: minimachine-linux-boot-33245921667
          path: replay-source

      - name: Download matching P3 cache
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33249488447
          github-token: ${{ github.token }}
          name: minimachine-double-hot-33249488447
          path: p3-cache-source

      - name: Prepare cache
        run: |
          cp "$(find p3-cache-source -name 'linux-p3-cache.pkl.gz' -print -quit)" replay-source/llvm/linux-p3-cache.pkl.gz

      - name: Run 50M P3 steps from start_kernel
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          /usr/bin/time -f 'NATIVE_COLD_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M'           python3 scripts/run-minimachine-linux.py replay-source/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --program-cache-in replay-source/llvm/linux-p3-cache.pkl.gz             --native-vm             --max-steps 50000000             --progress-every 0             2>&1 | tee replay-source/llvm/native-c-cold.log
          grep -E 'BOOT_EXEC_(BACKEND|START|MILESTONE|NATIVE_LIMIT|BLOCKED|HALTED)' replay-source/llvm/native-c-cold.log || true

      - name: Upload native cold log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-native-c-cold-${{ github.run_id }}
          path: replay-source/llvm/native-c-cold.log
          if-no-files-found: ignore
          retention-days: 7
