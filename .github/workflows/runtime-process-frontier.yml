name: MiniMachine Runtime Process Frontier

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - scripts/run-minimachine-linux.py
      - scripts/minimachine-runtime-suite.py
      - tests/test_minimachine_runtime_suite.py
      - .github/workflows/runtime-process-frontier.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: minimachine-runtime-process-frontier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  process-hot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate process runtime profile
        run: |
          python3 -m py_compile scripts/minimachine-runtime-suite.py
          python3 -m unittest tests.test_minimachine_runtime_suite -v
          python3 scripts/minimachine-runtime-suite.py list --profile process

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download qualified 64 MiB Linux image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33348074309
          github-token: ${{ github.token }}
          name: minimachine-linux-initramfs-33348074309
          path: linux

      - name: Download current-lowering Linux P3 cache
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33399276976
          github-token: ${{ github.token }}
          name: minimachine-linux-p3-console-current-33399276976
          path: current-cache

      - name: Download frozen BusyBox multicall image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33396890631
          github-token: ${{ github.token }}
          name: minimachine-busybox-multicall-33396890631
          path: busybox

      - name: Download qualified multicall kernel_execve checkpoint
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33456321243
          github-token: ${{ github.token }}
          name: minimachine-busybox-multicall-cold-33456321243
          path: cold

      - name: Rebuild process workload
        run: |
          cat > build/frozen-init.sh <<'SH'
          #!/bin/sh
          exit 0
          SH
          chmod +x build/frozen-init.sh
          python3 scripts/build-minimachine-busybox-rootfs.py             build/frozen-multicall.cpio             --busybox-image busybox/busybox-multicall.bflt             --init-script-file build/frozen-init.sh
          python3 scripts/minimachine-runtime-suite.py             write-init build/runtime-process-init.sh --profile process
          chmod +x build/runtime-process-init.sh build/mmrt-c*

      - name: Run process frontier from warm Linux boundary
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
          MINIMACHINE_USER_IMAGE_REFERENCE: ${{ github.workspace }}/busybox/busybox-multicall.bflt
        run: |
          set -o pipefail
          set +e
          inject_args=(--inject-init build/runtime-process-init.sh --inject-init-path /mmrt-proc)
          for case_script in build/mmrt-c*; do
            inject_args+=(--inject-file "$case_script" "/$(basename "$case_script")")
          done
          /usr/bin/time -f 'MMRT_PROCESS_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M'           timeout --signal=TERM 420           python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --program-cache-in current-cache/linux-initramfs-p3-cache-full-current.pkl.gz             --initramfs build/frozen-multicall.cpio             --native-vm             --checkpoint-in cold/busybox-multicall-kernel-execve.chk.gz             "${inject_args[@]}"             --restart-run-init-after-checkpoint             --restart-init-path /mmrt-proc             --stop-on-panic             --max-steps 0             --progress-every 0             2>&1 | tee build/runtime-process.log
          status=${PIPESTATUS[0]}
          set -e
          echo "MMRT_PROCESS_RUN_STATUS=$status" | tee -a build/runtime-process.log

      - name: Report process frontier
        if: always()
        run: |
          python3 scripts/minimachine-runtime-suite.py             frontier-log build/runtime-process.log --profile process || true
          grep -E 'BOOT_EXEC_(CHECKPOINT_RESTORED|USER_HANDOFF|USER_EXIT|BLOCKED)|^MMRT_'             build/runtime-process.log | tail -360 || true

      - name: Verify process result or known fork frontier
        run: |
          if grep -Fx 'MMRT_SUITE_PASS profile=process cases=5' build/runtime-process.log; then
            python3 scripts/minimachine-runtime-suite.py               verify-log build/runtime-process.log --profile process
            grep -F 'MMRT_PROCESS_RUN_STATUS=0' build/runtime-process.log
            echo MMRT_PROCESS_SUITE_PASS
          else
            grep -F 'error=unimplemented BusyBox userspace external fork' build/runtime-process.log
            grep -F 'MMRT_PROCESS_RUN_STATUS=1' build/runtime-process.log
            echo MMRT_PROCESS_FRONTIER_FORK
          fi

      - name: Upload process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-runtime-process-frontier-${{ github.run_id }}
          path: |
            build/runtime-process-init.sh
            build/mmrt-c*
            build/runtime-process.log
          if-no-files-found: warn
          retention-days: 7
