name: P3 Kallsyms Probe

on:
  push:
    branches: [work/p3-kallsyms]
    paths:
      - src/minimachine/kallsyms.py
      - scripts/run-minimachine-linux.py
      - .github/workflows/p3-kallsyms-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: minimachine-p3-kallsyms-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Find latest default-defconfig Linux LLVM artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/linux-minimachine-boot.yml/runs?status=completed&per_page=30"               --jq '.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main") | .id' |
              head -n 1
          )"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download linked Linux LLVM image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: minimachine-linux-boot-*
          path: replay-source
          merge-multiple: true

      - name: Probe Linux kallsyms over P3 addresses
        run: |
          python3 scripts/run-minimachine-linux.py replay-source/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --max-steps 20000000             --progress-every 0             --probe-kallsyms start_kernel
