name: Core IR Contract

on:
  push:
    branches: [main, "work/userspace-bringup"]
    paths:
      - src/minimachine/**
      - tests/**
      - .github/workflows/core-ir-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run IR contract tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
