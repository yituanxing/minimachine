name: Linux MiniMachine Roll Checkpoint Past PTY

on:
  push:
    branches: [work/checkpoint-after-kallsyms]
    paths:
      - .github/workflows/checkpoint-roll-past-pty.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: minimachine-checkpoint-roll-past-pty
  cancel-in-progress: true

jobs:
  roll:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4

      - name: Download pty-entry checkpoint
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33248074874
          github-token: ${{ github.token }}
          name: minimachine-linux-replay-33248074874
          path: checkpoint-source

      - name: Find matching default-defconfig Linux LLVM artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/linux-minimachine-boot.yml/runs?status=completed&per_page=30"               --jq '.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main") | .id' |
              head -n 1
          )"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "ROLL_SOURCE_RUN $run_id"

      - name: Download linked Linux LLVM image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: minimachine-linux-boot-*
          path: replay-source
          merge-multiple: true

      - name: Prepare checkpoint
        run: |
          checkpoint="$(find checkpoint-source -name 'pty-init.chk.gz' -print -quit)"
          test -n "$checkpoint"
          test -s "$checkpoint"
          cp "$checkpoint" replay-source/llvm/pty-init.chk.gz

      - name: Resume through PTY and roll checkpoint forward
        run: |
          set +e
          set -o pipefail
          python3 scripts/run-minimachine-linux.py replay-source/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --checkpoint-in replay-source/llvm/pty-init.chk.gz             --checkpoint-initcall pty_init             --checkpoint-after-initcall pty_init             --checkpoint-out replay-source/llvm/after-pty.chk.gz             --max-steps 120000000             --progress-every 0             2>&1 | tee replay-source/llvm/roll-past-pty.log
          status=${PIPESTATUS[0]}
          set -e
          echo "ROLL_EXEC_STATUS $status"
          grep -F 'BOOT_EXEC_CHECKPOINT_ARMED after_initcall=pty_init steps=111552266 source=resume' replay-source/llvm/roll-past-pty.log
          test -s replay-source/llvm/after-pty.chk.gz
          grep -F 'BOOT_EXEC_CHECKPOINT_SAVED path=replay-source/llvm/after-pty.chk.gz' replay-source/llvm/roll-past-pty.log
          echo "AFTER_PTY_CHECKPOINT_BYTES $(stat -c%s replay-source/llvm/after-pty.chk.gz)"

      - name: Upload rolled checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-after-pty-checkpoint-${{ github.run_id }}
          path: |
            replay-source/llvm/roll-past-pty.log
            replay-source/llvm/after-pty.chk.gz
          if-no-files-found: ignore
          retention-days: 14
