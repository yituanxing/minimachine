name: Linux MiniMachine PTY Chain 128 To 256

on:
  push:
    branches: [work/checkpoint-after-kallsyms]
    paths:
      - .github/workflows/checkpoint-pty-chain-128-256.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4

      - name: Download hit128 checkpoint
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33249348738
          github-token: ${{ github.token }}
          name: minimachine-pty-hit-128-33249348738
          path: checkpoint-source

      - name: Download lowered P3 cache
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33249488447
          github-token: ${{ github.token }}
          name: minimachine-double-hot-33249488447
          path: cache-source

      - name: Find matching Linux LLVM artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/linux-minimachine-boot.yml/runs?status=completed&per_page=30"               --jq '.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main") | .id' |
              head -n 1
          )"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download linked Linux LLVM image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: minimachine-linux-boot-*
          path: replay-source
          merge-multiple: true

      - name: Prepare double-hot inputs
        run: |
          checkpoint="$(find checkpoint-source -name 'pty-hit-128.chk.gz' -print -quit)"
          cache="$(find cache-source -name 'linux-p3-cache.pkl.gz' -print -quit)"
          test -n "$checkpoint"
          test -n "$cache"
          cp "$checkpoint" replay-source/llvm/pty-hit-128.chk.gz
          cp "$cache" replay-source/llvm/linux-p3-cache.pkl.gz
          echo "CHAIN_INPUT checkpoint_bytes=$(stat -c%s replay-source/llvm/pty-hit-128.chk.gz) cache_bytes=$(stat -c%s replay-source/llvm/linux-p3-cache.pkl.gz)"

      - name: Advance from cumulative hit128 to hit256
        run: |
          set -o pipefail
          start="$(date +%s)"
          python3 scripts/run-minimachine-linux.py replay-source/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --program-cache-in replay-source/llvm/linux-p3-cache.pkl.gz             --checkpoint-in replay-source/llvm/pty-hit-128.chk.gz             --checkpoint-initcall pty_init             --checkpoint-out replay-source/llvm/pty-hit-256.chk.gz             --checkpoint-function tty_register_device             --checkpoint-function-hit 128             --stop-after-checkpoint             --max-steps 100000000             --progress-every 0             2>&1 | tee replay-source/llvm/pty-chain-128-256.log
          end="$(date +%s)"
          echo "PTY_CHAIN_SECONDS $((end-start))"
          grep -F 'BOOT_EXEC_PROGRAM_CACHE_LOADED' replay-source/llvm/pty-chain-128-256.log
          grep -F 'BOOT_EXEC_CHECKPOINT_RESTORED' replay-source/llvm/pty-chain-128-256.log
          grep -F 'function=tty_register_device hit=128' replay-source/llvm/pty-chain-128-256.log
          test -s replay-source/llvm/pty-hit-256.chk.gz
          echo "PTY_HIT256_CHECKPOINT_BYTES $(stat -c%s replay-source/llvm/pty-hit-256.chk.gz)"

      - name: Upload cumulative hit256 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-pty-hit256-${{ github.run_id }}
          path: |
            replay-source/llvm/pty-chain-128-256.log
            replay-source/llvm/pty-hit-256.chk.gz
          if-no-files-found: ignore
          retention-days: 14
