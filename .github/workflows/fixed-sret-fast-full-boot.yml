name: MiniMachine Fixed Sret Fast Full Boot

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - .github/workflows/fixed-sret-fast-full-boot.yml

permissions:
  contents: read
  actions: read

jobs:
  fast-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build native P3 VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download exact default Linux initramfs image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33264250619
          github-token: ${{ github.token }}
          name: minimachine-linux-initramfs-33264250619
          path: exact

      - name: Download fixed P3 cache from prior gate run
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33293453553
          github-token: ${{ github.token }}
          name: minimachine-fixed-sret-33293453553
          path: fixed

      - name: Verify cache exists
        run: |
          find fixed -maxdepth 2 -type f -ls
          test -s fixed/fixed-linux-p3-cache.pkl.gz

      - name: Full native boot with fixed cache
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          set -o pipefail
          /usr/bin/time -f 'FIXED_FAST_FULL_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          python3 scripts/run-minimachine-linux.py exact/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in fixed/fixed-linux-p3-cache.pkl.gz \
            --initramfs exact/out/minimachine-initramfs.cpio \
            --native-vm \
            --native-boot-phases-only \
            --native-report-every 50000000 \
            --stop-after-user-handoff \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee fixed-fast-full.log

      - name: Summarize
        if: always()
        run: |
          grep -E 'FIXED_FAST_FULL|BOOT_EXEC_(NATIVE_PROGRESS|MILESTONE|INITRAMFS_NAME|INITRAMFS_COPY|INITRAMFS_RESET|INITRAMFS_UNPACK_ENTER|USER_HANDOFF|USER_HANDOFF_STOP|PANIC_ENTER|BLOCKED|HALTED|STAGE)' fixed-fast-full.log || true

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-fixed-sret-fast-${{ github.run_id }}
          path: fixed-fast-full.log
          if-no-files-found: ignore
          retention-days: 14
