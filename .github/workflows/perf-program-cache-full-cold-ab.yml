name: MiniMachine Program Cache Full Cold AB

on:
  workflow_dispatch:
  push:
    branches: [research/program-cache-load-profile]
    paths:
      - src/minimachine/program_cache.py
      - .github/workflows/perf-program-cache-full-cold-ab.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: program-cache-full-cold-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate program cache unit tests
        run: python3 -m unittest tests.test_program_cache

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared \
            native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download fixed P3 cache
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 34036739708
          github-token: ${{ github.token }}
          name: minimachine-linux-p3-console-current-34036739708
          path: current-cache

      - name: Download exact Linux image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33632628029
          github-token: ${{ github.token }}
          name: minimachine-linux-initramfs-33632628029
          path: linux

      - name: Download exact BusyBox multicall image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 34144063868
          github-token: ${{ github.token }}
          name: minimachine-busybox-multicall-34144063868
          path: busybox

      - name: Build real BusyBox init rootfs
        run: |
          cat > build/rcS <<'SH'
          #!/bin/sh
          PATH=/bin
          export PATH
          echo MINIMACHINE_REAL_BUSYBOX_RCS
          exec /bin/sh
          SH
          chmod +x build/rcS
          python3 scripts/build-minimachine-busybox-rootfs.py \
            build/busybox-real-init.cpio \
            --busybox-image busybox/busybox-multicall.bflt \
            --busybox-init \
            --rc-script-file build/rcS
          test -s build/busybox-real-init.cpio

      - name: Full cold streaming-cache control
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
          MINIMACHINE_PROGRAM_CACHE_BUFFERED: "0"
        run: |
          set -o pipefail
          /usr/bin/time -f 'PCACHE_AB_WALL variant=control wall=%e user=%U sys=%S rss_kb=%M' \
          timeout --signal=TERM 600 \
          python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in current-cache/linux-initramfs-p3-cache-full-current.pkl.gz \
            --initramfs build/busybox-real-init.cpio \
            --native-vm \
            --native-pack-cache-out build/control-native-pack.bin \
            --native-boot-phases-only \
            --checkpoint-out build/control-kernel-execve.chk.gz \
            --checkpoint-function kernel_execve \
            --checkpoint-function-hit 1 \
            --stop-after-checkpoint \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee build/control.log
          grep -F 'BOOT_EXEC_CHECKPOINT_SAVED ' build/control.log
          ! grep -F 'BOOT_EXEC_BLOCKED ' build/control.log
          rm -f build/control-native-pack.bin

      - name: Full cold buffered-cache candidate
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
          MINIMACHINE_PROGRAM_CACHE_BUFFERED: "1"
        run: |
          set -o pipefail
          /usr/bin/time -f 'PCACHE_AB_WALL variant=candidate wall=%e user=%U sys=%S rss_kb=%M' \
          timeout --signal=TERM 600 \
          python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in current-cache/linux-initramfs-p3-cache-full-current.pkl.gz \
            --initramfs build/busybox-real-init.cpio \
            --native-vm \
            --native-pack-cache-out build/candidate-native-pack.bin \
            --native-boot-phases-only \
            --checkpoint-out build/candidate-kernel-execve.chk.gz \
            --checkpoint-function kernel_execve \
            --checkpoint-function-hit 1 \
            --stop-after-checkpoint \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee build/candidate.log
          grep -F 'BOOT_EXEC_CHECKPOINT_SAVED ' build/candidate.log
          ! grep -F 'BOOT_EXEC_BLOCKED ' build/candidate.log
          rm -f build/candidate-native-pack.bin

      - name: Report full cold A/B
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          control = Path("build/control.log").read_text()
          candidate = Path("build/candidate.log").read_text()

          def get(pattern, text, label):
              m = re.search(pattern, text)
              if not m:
                  raise SystemExit(f"missing {label}")
              return float(m.group(1))

          cw = get(r"PCACHE_AB_WALL variant=control wall=([0-9.]+)", control, "control wall")
          nw = get(r"PCACHE_AB_WALL variant=candidate wall=([0-9.]+)", candidate, "candidate wall")
          cp = get(r"BOOT_EXEC_STAGE stage=program-cache elapsed_s=([0-9.]+)", control, "control program cache")
          np = get(r"BOOT_EXEC_STAGE stage=program-cache elapsed_s=([0-9.]+)", candidate, "candidate program cache")
          ce = get(r"BOOT_EXEC_STAGE stage=execute-end execute_s=([0-9.]+)", control, "control execute")
          ne = get(r"BOOT_EXEC_STAGE stage=execute-end execute_s=([0-9.]+)", candidate, "candidate execute")
          csteps = re.findall(r"BOOT_EXEC_CHECKPOINT_SAVED .*steps=([0-9]+).*function=kernel_execve", control)[-1]
          nsteps = re.findall(r"BOOT_EXEC_CHECKPOINT_SAVED .*steps=([0-9]+).*function=kernel_execve", candidate)[-1]
          if csteps != nsteps:
              raise SystemExit(f"step mismatch control={csteps} candidate={nsteps}")

          delta = nw - cw
          pct = delta * 100.0 / cw
          print(
              f"PCACHE_FULL_COLD_AB control={cw:.3f} candidate={nw:.3f} "
              f"delta_s={delta:.3f} delta_pct={pct:.2f} steps={csteps}"
          )
          print(
              f"PCACHE_STAGE_AB control={cp:.3f} candidate={np:.3f} "
              f"delta_s={np-cp:.3f} execute_control={ce:.3f} execute_candidate={ne:.3f}"
          )
          PY

      - name: Upload A/B logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-program-cache-full-cold-ab-${{ github.run_id }}
          path: |
            build/control.log
            build/candidate.log
          if-no-files-found: warn
          retention-days: 7
