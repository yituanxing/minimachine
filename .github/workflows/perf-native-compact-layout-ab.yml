name: MiniMachine Compact Native Layout AB

on:
  workflow_dispatch:
  push:
    branches: [research/native-compact-inst-layout]
    paths:
      - native/p3vm.c
      - src/minimachine/native_vm.py
      - tests/test_native_compact_layout.py
      - .github/workflows/perf-native-compact-layout-ab.yml

permissions:
  contents: read
  actions: read

jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout compact candidate
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Checkout exact formal baseline
        uses: actions/checkout@v4
        with:
          ref: b0cdd4465400fff2f7d2cadf22a62080191b63dc
          path: control

      - name: Build both native VMs
        run: |
          mkdir -p control/build candidate/build inputs
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared             control/native/p3vm.c -o control/build/libminimachine_p3vm.so
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared             candidate/native/p3vm.c -o candidate/build/libminimachine_p3vm.so

      - name: Validate compact ABI and execution
        working-directory: candidate
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/candidate/build/libminimachine_p3vm.so
        run: |
          python3 -m unittest tests.test_native_compact_layout -v

      - name: Validate formal ABI
        working-directory: control
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/control/build/libminimachine_p3vm.so
        run: |
          python3 - <<'PY'
          import ctypes
          from src.minimachine.native_vm import CInst, COperand
          print(
              f"CONTROL_NATIVE_LAYOUT operand={ctypes.sizeof(COperand)} "
              f"inst={ctypes.sizeof(CInst)}"
          )
          assert ctypes.sizeof(COperand) == 32
          assert ctypes.sizeof(CInst) == 200
          PY

      - name: Download current P3 cache
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 34326126118
          github-token: ${{ github.token }}
          name: minimachine-linux-p3-console-current-34326126118
          path: inputs/current-cache

      - name: Download exact Linux image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33632628029
          github-token: ${{ github.token }}
          name: minimachine-linux-initramfs-33632628029
          path: inputs/linux

      - name: Download proven memory-default cold generation
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 34332075334
          github-token: ${{ github.token }}
          name: minimachine-busybox-real-cold-34332075334
          path: inputs/cold

      - name: Build formal 200B native pack
        working-directory: control
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/control/build/libminimachine_p3vm.so
          MINIMACHINE_DISABLE_GC: "1"
          MINIMACHINE_NATIVE_ROR32_INTRINSIC: "1"
          MINIMACHINE_NATIVE_I128_INTRINSICS: "1"
          MINIMACHINE_NATIVE_SCALAR_INTRINSICS: "1"
          MINIMACHINE_NATIVE_I128_VALUE_INTRINSICS: "1"
          MINIMACHINE_NATIVE_MEMORY_INTRINSICS: "1"
        run: |
          set -o pipefail
          /usr/bin/time -f 'COMPACT_PACK_WALL variant=control wall=%e user=%U sys=%S rss_kb=%M'           timeout --signal=TERM 900           python3 scripts/run-minimachine-linux.py ../inputs/linux/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --program-cache-in ../inputs/current-cache/linux-initramfs-p3-cache-full-current.pkl.gz             --initramfs ../inputs/cold/busybox-real-init.cpio             --native-vm             --native-pack-cache-out build/control-native-pack.bin             --stop-on-panic             --max-steps 1             --progress-every 0             2>&1 | tee build/control-pack.log
          grep -F 'BOOT_EXEC_NATIVE_PACK_CACHE_SAVED ' build/control-pack.log
          stat -c 'COMPACT_PACK_BYTES variant=control bytes=%s' build/control-native-pack.bin | tee -a build/control-pack.log

      - name: Build compact 136B native pack
        working-directory: candidate
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/candidate/build/libminimachine_p3vm.so
          MINIMACHINE_DISABLE_GC: "1"
          MINIMACHINE_NATIVE_ROR32_INTRINSIC: "1"
          MINIMACHINE_NATIVE_I128_INTRINSICS: "1"
          MINIMACHINE_NATIVE_SCALAR_INTRINSICS: "1"
          MINIMACHINE_NATIVE_I128_VALUE_INTRINSICS: "1"
          MINIMACHINE_NATIVE_MEMORY_INTRINSICS: "1"
        run: |
          set -o pipefail
          /usr/bin/time -f 'COMPACT_PACK_WALL variant=candidate wall=%e user=%U sys=%S rss_kb=%M'           timeout --signal=TERM 900           python3 scripts/run-minimachine-linux.py ../inputs/linux/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --program-cache-in ../inputs/current-cache/linux-initramfs-p3-cache-full-current.pkl.gz             --initramfs ../inputs/cold/busybox-real-init.cpio             --native-vm             --native-pack-cache-out build/candidate-native-pack.bin             --stop-on-panic             --max-steps 1             --progress-every 0             2>&1 | tee build/candidate-pack.log
          grep -F 'BOOT_EXEC_NATIVE_PACK_CACHE_SAVED ' build/candidate-pack.log
          stat -c 'COMPACT_PACK_BYTES variant=candidate bytes=%s' build/candidate-native-pack.bin | tee -a build/candidate-pack.log

      - name: Compact 136B cold execution
        working-directory: candidate
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/candidate/build/libminimachine_p3vm.so
          MINIMACHINE_DISABLE_GC: "1"
          MINIMACHINE_NATIVE_ROR32_INTRINSIC: "1"
          MINIMACHINE_NATIVE_I128_INTRINSICS: "1"
          MINIMACHINE_NATIVE_SCALAR_INTRINSICS: "1"
          MINIMACHINE_NATIVE_I128_VALUE_INTRINSICS: "1"
          MINIMACHINE_NATIVE_MEMORY_INTRINSICS: "1"
        run: |
          set -o pipefail
          /usr/bin/time -f 'COMPACT_COLD_WALL variant=candidate wall=%e user=%U sys=%S rss_kb=%M'           timeout --signal=TERM 900           python3 scripts/run-minimachine-linux.py ../inputs/linux/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --native-hot-cache-in ../inputs/cold/linux-native-hot-cache.pkl.gz             --initramfs ../inputs/cold/busybox-real-init.cpio             --native-vm             --native-pack-cache-in build/candidate-native-pack.bin             --native-boot-phases-only             --checkpoint-out build/candidate.chk.gz             --checkpoint-function kernel_execve             --checkpoint-function-hit 1             --stop-after-checkpoint             --stop-on-panic             --max-steps 0             --progress-every 0             2>&1 | tee build/candidate-cold.log
          grep -F 'BOOT_EXEC_CHECKPOINT_SAVED ' build/candidate-cold.log
          ! grep -F 'BOOT_EXEC_BLOCKED ' build/candidate-cold.log

      - name: Formal 200B cold execution
        working-directory: control
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/control/build/libminimachine_p3vm.so
          MINIMACHINE_DISABLE_GC: "1"
          MINIMACHINE_NATIVE_ROR32_INTRINSIC: "1"
          MINIMACHINE_NATIVE_I128_INTRINSICS: "1"
          MINIMACHINE_NATIVE_SCALAR_INTRINSICS: "1"
          MINIMACHINE_NATIVE_I128_VALUE_INTRINSICS: "1"
          MINIMACHINE_NATIVE_MEMORY_INTRINSICS: "1"
        run: |
          set -o pipefail
          /usr/bin/time -f 'COMPACT_COLD_WALL variant=control wall=%e user=%U sys=%S rss_kb=%M'           timeout --signal=TERM 900           python3 scripts/run-minimachine-linux.py ../inputs/linux/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --native-hot-cache-in ../inputs/cold/linux-native-hot-cache.pkl.gz             --initramfs ../inputs/cold/busybox-real-init.cpio             --native-vm             --native-pack-cache-in build/control-native-pack.bin             --native-boot-phases-only             --checkpoint-out build/control.chk.gz             --checkpoint-function kernel_execve             --checkpoint-function-hit 1             --stop-after-checkpoint             --stop-on-panic             --max-steps 0             --progress-every 0             2>&1 | tee build/control-cold.log
          grep -F 'BOOT_EXEC_CHECKPOINT_SAVED ' build/control-cold.log
          ! grep -F 'BOOT_EXEC_BLOCKED ' build/control-cold.log

      - name: Report compact layout A/B
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          cp = Path("control/build/control-pack.log").read_text()
          np = Path("candidate/build/candidate-pack.log").read_text()
          cc = Path("control/build/control-cold.log").read_text()
          nc = Path("candidate/build/candidate-cold.log").read_text()

          def one(pattern, text, label, cast=float):
              m = re.search(pattern, text)
              if not m:
                  raise SystemExit(f"missing {label}")
              return cast(m.group(1))

          cb = one(r"COMPACT_PACK_BYTES variant=control bytes=([0-9]+)", cp, "control bytes", int)
          nb = one(r"COMPACT_PACK_BYTES variant=candidate bytes=([0-9]+)", np, "candidate bytes", int)
          cpw = one(r"COMPACT_PACK_WALL variant=control wall=([0-9.]+)", cp, "control pack wall")
          npw = one(r"COMPACT_PACK_WALL variant=candidate wall=([0-9.]+)", np, "candidate pack wall")
          cw = one(r"COMPACT_COLD_WALL variant=control wall=([0-9.]+)", cc, "control cold")
          nw = one(r"COMPACT_COLD_WALL variant=candidate wall=([0-9.]+)", nc, "candidate cold")
          ce = one(r"BOOT_EXEC_STAGE stage=execute-end execute_s=([0-9.]+)", cc, "control execute")
          ne = one(r"BOOT_EXEC_STAGE stage=execute-end execute_s=([0-9.]+)", nc, "candidate execute")
          ci = one(r"BOOT_EXEC_STAGE stage=native-vm-init seconds=([0-9.]+)", cc, "control init")
          ni = one(r"BOOT_EXEC_STAGE stage=native-vm-init seconds=([0-9.]+)", nc, "candidate init")
          cs = re.findall(r"BOOT_EXEC_CHECKPOINT_SAVED .*steps=([0-9]+).*function=kernel_execve", cc)[-1]
          ns = re.findall(r"BOOT_EXEC_CHECKPOINT_SAVED .*steps=([0-9]+).*function=kernel_execve", nc)[-1]
          if cs != ns:
              raise SystemExit(f"step mismatch control={cs} candidate={ns}")

          print(
              f"COMPACT_SIZE_AB control={cb} candidate={nb} "
              f"delta_bytes={nb-cb} delta_pct={(nb-cb)*100.0/cb:.2f}"
          )
          print(
              f"COMPACT_PACK_AB control={cpw:.3f} candidate={npw:.3f} "
              f"delta_s={npw-cpw:.3f} delta_pct={(npw-cpw)*100.0/cpw:.2f}"
          )
          print(
              f"COMPACT_COLD_AB control={cw:.3f} candidate={nw:.3f} "
              f"delta_s={nw-cw:.3f} delta_pct={(nw-cw)*100.0/cw:.2f} steps={cs}"
          )
          print(
              f"COMPACT_INIT_AB control={ci:.3f} candidate={ni:.3f} "
              f"delta_s={ni-ci:.3f} delta_pct={(ni-ci)*100.0/ci:.2f}"
          )
          print(
              f"COMPACT_EXEC_AB control={ce:.3f} candidate={ne:.3f} "
              f"delta_s={ne-ce:.3f} delta_pct={(ne-ce)*100.0/ce:.2f}"
          )
          PY

      - name: Upload compact A/B logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-compact-layout-ab-${{ github.run_id }}
          path: |
            control/build/control-pack.log
            candidate/build/candidate-pack.log
            control/build/control-cold.log
            candidate/build/candidate-cold.log
          if-no-files-found: warn
          retention-days: 7
