name: MiniMachine BusyBox Multicall Cold

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - src/minimachine/program_cache.py
      - src/minimachine/llvm_text.py
      - src/minimachine/layout.py
      - src/minimachine/legalize.py
      - src/minimachine/abi.py
      - src/minimachine/lower_p3.py
      - src/minimachine/muir.py
      - src/minimachine/p3.py
      - src/minimachine/verify.py
      - src/minimachine/image.py
      - linux-overlay/arch/minimachine/**
      - scripts/build-minimachine-initramfs.py
      - scripts/check-minimachine-boot.sh
      - scripts/build-minimachine-busybox-rootfs.py
      - .github/workflows/initramfs-build.yml
      - .github/workflows/refresh-console-p3-cache.yml
      - .github/workflows/busybox-multicall-cold.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: busybox-real-cold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multicall-cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared \
            native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download generation-matched Linux cache and exact image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lowering_sha="$(git log -1 --format=%H -- \
            src/minimachine/program_cache.py \
            src/minimachine/llvm_text.py \
            src/minimachine/layout.py \
            src/minimachine/legalize.py \
            src/minimachine/abi.py \
            src/minimachine/lower_p3.py \
            src/minimachine/muir.py \
            src/minimachine/p3.py \
            src/minimachine/verify.py \
            src/minimachine/image.py)"
          linux_sha="$(git log -1 --format=%H -- \
            linux-overlay/arch/minimachine \
            scripts/build-minimachine-initramfs.py \
            scripts/check-minimachine-boot.sh \
            .github/workflows/initramfs-build.yml)"
          test -n "$lowering_sha"
          test -n "$linux_sha"
          echo "LOWERING_SHA=$lowering_sha"
          echo "LINUX_SHA=$linux_sha"

          refresh_id=""
          for attempt in $(seq 1 60); do
            for candidate_id in $(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow refresh-console-p3-cache.yml \
              --branch work/native-p3-vm \
              --status success \
              --limit 30 \
              --json databaseId \
              --jq '.[].databaseId'); do
              rm -rf candidate-cache
              if ! gh run download "$candidate_id" \
                --repo "$GITHUB_REPOSITORY" \
                --name "minimachine-linux-p3-console-current-$candidate_id" \
                --dir candidate-cache >/dev/null 2>&1; then
                continue
              fi
              test -s candidate-cache/input-run.env || continue
              candidate_lowering="$(sed -n 's/^LOWERING_SHA=//p' candidate-cache/input-run.env)"
              candidate_linux="$(sed -n 's/^LINUX_SHA=//p' candidate-cache/input-run.env)"
              if [ "$candidate_lowering" = "$lowering_sha" ] && \
                 [ "$candidate_linux" = "$linux_sha" ]; then
                refresh_id="$candidate_id"
                rm -rf current-cache
                mv candidate-cache current-cache
                break
              fi
            done
            if [ -n "$refresh_id" ]; then
              break
            fi
            echo "waiting for generation-matched P3 refresh attempt=$attempt lowering=$lowering_sha linux=$linux_sha"
            sleep 10
          done
          test -n "$refresh_id"

          test -s current-cache/input-run.env
          test -s current-cache/linux-initramfs-p3-cache-full-current.pkl.gz
          . current-cache/input-run.env
          test "$LOWERING_SHA" = "$lowering_sha"
          test "$LINUX_SHA" = "$linux_sha"
          test -n "$LINUX_RUN_ID"

          linux_head="$(gh run view "$LINUX_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json headSha --jq '.headSha')"
          test "$linux_head" = "$linux_sha"

          printf 'LOWERING_SHA=%s\nLINUX_SHA=%s\nP3_REFRESH_RUN_ID=%s\nLINUX_RUN_ID=%s\n' \
            "$lowering_sha" "$linux_sha" "$refresh_id" "$LINUX_RUN_ID" | tee build/input-runs.env

          gh run download "$LINUX_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-linux-initramfs-$LINUX_RUN_ID" \
            --dir linux

          test -s linux/llvm/linked.ll
          test -s linux/out/minimachine-initramfs.cpio

      - name: Download lowering-matched BusyBox multicall image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . build/input-runs.env
          test -n "$LOWERING_SHA"

          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow busybox-multicall-bundle.yml \
              --branch work/native-p3-vm \
              --limit 50 \
              --json databaseId,headSha,status,conclusion \
              --jq ".[] | select(.headSha == \"$LOWERING_SHA\" and .status == \"completed\" and .conclusion == \"success\") | .databaseId" \
              | head -1)"
            if [ -n "$run_id" ]; then
              break
            fi
            echo "waiting for lowering-matched BusyBox bundle attempt=$attempt sha=$LOWERING_SHA"
            sleep 10
          done
          test -n "$run_id"
          echo "BUSYBOX_RUN_ID=$run_id" | tee -a build/input-runs.env

          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-busybox-multicall-$run_id" \
            --dir busybox

          test -s busybox/busybox-multicall.bflt

      - name: Build real BusyBox init rootfs
        run: |
          cat > build/rcS <<'SH'
          #!/bin/sh
          PATH=/bin
          export PATH
          echo MINIMACHINE_REAL_BUSYBOX_RCS
          exec /bin/sh
          SH
          chmod +x build/rcS

          python3 scripts/build-minimachine-busybox-rootfs.py \
            build/busybox-real-init.cpio \
            --busybox-image busybox/busybox-multicall.bflt \
            --busybox-init \
            --rc-script-file build/rcS \
            2>&1 | tee build/busybox-real-rootfs.log

          grep -F 'mode=busybox-init' build/busybox-real-rootfs.log
          test -s build/busybox-real-init.cpio
          cat build/input-runs.env
          ls -lh build/busybox-real-init.cpio busybox/busybox-multicall.bflt

      - name: Cold boot real BusyBox rootfs to first exec
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          set -o pipefail
          set +e
          /usr/bin/time -f 'BUSYBOX_REAL_COLD_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          timeout --signal=TERM 1500 \
          python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in current-cache/linux-initramfs-p3-cache-full-current.pkl.gz \
            --initramfs build/busybox-real-init.cpio \
            --native-vm \
            --native-boot-phases-only \
            --native-report-every 50000000 \
            --checkpoint-out build/busybox-real-kernel-execve.chk.gz \
            --checkpoint-function kernel_execve \
            --checkpoint-function-hit 1 \
            --stop-after-checkpoint \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee build/busybox-real-cold.log
          status=${PIPESTATUS[0]}
          set -e
          echo "BUSYBOX_REAL_COLD_STATUS=$status" | tee -a build/busybox-real-cold.log

      - name: Assert real-rootfs kernel_execve checkpoint
        run: |
          grep -F 'BOOT_EXEC_INITRAMFS path=build/busybox-real-init.cpio' build/busybox-real-cold.log
          grep -F 'BOOT_EXEC_CHECKPOINT_SAVED ' build/busybox-real-cold.log
          grep -F 'function=kernel_execve hit=1' build/busybox-real-cold.log
          test -s build/busybox-real-kernel-execve.chk.gz
          ! grep -F 'BOOT_EXEC_CHECKPOINT_RESTORED ' build/busybox-real-cold.log
          ! grep -F 'BOOT_EXEC_BLOCKED ' build/busybox-real-cold.log

      - name: Summarize real BusyBox cold boot
        if: always()
        run: |
          grep -E 'BOOT_EXEC_(STAGE|MILESTONE|INITRAMFS|CHECKPOINT_SAVED|USER_HANDOFF|USER_EXTERNAL|USER_SYSCALL|USER_EXIT|HALTED|BLOCKED)|BUSYBOX_REAL_' \
            build/busybox-real-cold.log | tail -520 || true

      - name: Upload real BusyBox cold evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-busybox-real-cold-${{ github.run_id }}
          path: |
            build/input-runs.env
            build/rcS
            build/busybox-real-rootfs.log
            build/busybox-real-init.cpio
            build/busybox-real-cold.log
            build/busybox-real-kernel-execve.chk.gz
          if-no-files-found: warn
          retention-days: 7

  real-software:
    needs: multicall-cold
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared \
            native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download exact cold rootfs and checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-busybox-real-cold-$GITHUB_RUN_ID" \
            --dir cold

          test -s cold/input-runs.env
          test -s cold/busybox-real-init.cpio
          test -s cold/busybox-real-kernel-execve.chk.gz
          cat cold/input-runs.env

      - name: Download exact Linux, P3 cache, and BusyBox inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -a
          . cold/input-runs.env
          set +a

          test -n "$P3_REFRESH_RUN_ID"
          test -n "$LINUX_RUN_ID"
          test -n "$BUSYBOX_RUN_ID"

          gh run download "$P3_REFRESH_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-linux-p3-console-current-$P3_REFRESH_RUN_ID" \
            --dir current-cache

          gh run download "$LINUX_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-linux-initramfs-$LINUX_RUN_ID" \
            --dir linux

          gh run download "$BUSYBOX_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-busybox-multicall-$BUSYBOX_RUN_ID" \
            --dir busybox

          test -s current-cache/linux-initramfs-p3-cache-full-current.pkl.gz
          test -s linux/llvm/linked.ll
          test -s busybox/busybox-multicall.bflt

      - name: Continue real BusyBox init and shell
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
          MINIMACHINE_USER_IMAGE_REFERENCE: ${{ github.workspace }}/busybox/busybox-multicall.bflt
        run: |
          set -o pipefail
          set +e
          {
            echo 'echo MINIMACHINE_REAL_EXTERNAL_BEGIN'
            echo '/bin/uname -s'
            echo '/bin/ls /etc'
            echo '/bin/cat /etc/inittab'
            echo 'echo MINIMACHINE_REAL_EXTERNAL_END'
            echo 'exit'
          } | \
          /usr/bin/time -f 'MINIMACHINE_REAL_SOFTWARE_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          timeout --signal=TERM 300 \
          python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in current-cache/linux-initramfs-p3-cache-full-current.pkl.gz \
            --initramfs cold/busybox-real-init.cpio \
            --native-vm \
            --checkpoint-in cold/busybox-real-kernel-execve.chk.gz \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee build/busybox-real-software.log
          status=${PIPESTATUS[1]}
          set -e
          echo "MINIMACHINE_REAL_SOFTWARE_STATUS=$status" | tee -a build/busybox-real-software.log

      - name: Report real-software frontier
        if: always()
        run: |
          echo '=== real software frontier ==='
          grep -E 'BOOT_EXEC_(CHECKPOINT_RESTORED|USER_HANDOFF|USER_EXTERNAL|USER_SYSCALL|USER_EXIT|BLOCKED|HALTED)|MINIMACHINE_REAL_' \
            build/busybox-real-software.log | tail -520 || true

          if grep -F 'BOOT_EXEC_BLOCKED ' build/busybox-real-software.log >/dev/null; then
            echo 'MINIMACHINE_REAL_FRONTIER=blocked'
            grep -F 'BOOT_EXEC_BLOCKED ' build/busybox-real-software.log | tail -1
          elif grep -Fx 'MINIMACHINE_REAL_EXTERNAL_END' build/busybox-real-software.log >/dev/null; then
            echo 'MINIMACHINE_REAL_FRONTIER=external-software-passed'
          else
            echo 'MINIMACHINE_REAL_FRONTIER=before-external-software-end'
          fi

      - name: Assert real-software progress
        run: |
          grep -F 'BOOT_EXEC_CHECKPOINT_RESTORED ' build/busybox-real-software.log
          grep -F 'BOOT_EXEC_USER_HANDOFF ' build/busybox-real-software.log
          grep -Fx 'MINIMACHINE_REAL_BUSYBOX_RCS' build/busybox-real-software.log
          grep -Fx 'MINIMACHINE_REAL_EXTERNAL_BEGIN' build/busybox-real-software.log
          grep -Fx 'MINIMACHINE_REAL_EXTERNAL_END' build/busybox-real-software.log
          ! grep -F 'BOOT_EXEC_BLOCKED ' build/busybox-real-software.log
          grep -E '^MINIMACHINE_REAL_SOFTWARE_STATUS=(0|124)$' build/busybox-real-software.log

      - name: Upload real-software evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-busybox-real-software-${{ github.run_id }}
          path: build/busybox-real-software.log
          if-no-files-found: warn
          retention-days: 7
