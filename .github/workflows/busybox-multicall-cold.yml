name: MiniMachine BusyBox Multicall Cold

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - scripts/build-minimachine-busybox-rootfs.py
      - .github/workflows/busybox-multicall-cold.yml

permissions:
  contents: read
  actions: read

jobs:
  multicall-cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared             native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download latest qualified Linux image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list             --repo "$GITHUB_REPOSITORY"             --workflow initramfs-build.yml             --branch work/native-p3-vm             --status success             --limit 1             --json databaseId             --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "LINUX_RUN_ID=$run_id" | tee build/input-runs.env
          gh run download "$run_id"             --repo "$GITHUB_REPOSITORY"             --name "minimachine-linux-initramfs-$run_id"             --dir linux
          test -s linux/llvm/linked.ll
          test -s linux/llvm/linux-initramfs-p3-cache.pkl.gz

      - name: Download latest BusyBox multicall image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list             --repo "$GITHUB_REPOSITORY"             --workflow busybox-multicall-bundle.yml             --branch work/native-p3-vm             --status success             --limit 1             --json databaseId             --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "BUSYBOX_RUN_ID=$run_id" | tee -a build/input-runs.env
          gh run download "$run_id"             --repo "$GITHUB_REPOSITORY"             --name "minimachine-busybox-multicall-$run_id"             --dir busybox
          test -s busybox/busybox-multicall.bflt

      - name: Build real BusyBox init rootfs
        run: |
          cat > build/rcS <<'SH'
          #!/bin/sh
          PATH=/bin
          export PATH
          echo MINIMACHINE_REAL_BUSYBOX_RCS
          exec /bin/sh
          SH
          chmod +x build/rcS

          python3 scripts/build-minimachine-busybox-rootfs.py             build/busybox-real-init.cpio             --busybox-image busybox/busybox-multicall.bflt             --busybox-init             --rc-script-file build/rcS             2>&1 | tee build/busybox-real-rootfs.log

          grep -F 'mode=busybox-init' build/busybox-real-rootfs.log
          test -s build/busybox-real-init.cpio
          cat build/input-runs.env
          ls -lh build/busybox-real-init.cpio busybox/busybox-multicall.bflt

      - name: Cold boot real BusyBox rootfs to first exec
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          set -o pipefail
          set +e
          /usr/bin/time -f 'BUSYBOX_REAL_COLD_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M'           timeout --signal=TERM 1500           python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --program-cache-in linux/llvm/linux-initramfs-p3-cache.pkl.gz             --initramfs build/busybox-real-init.cpio             --native-vm             --native-boot-phases-only             --native-report-every 50000000             --checkpoint-out build/busybox-real-kernel-execve.chk.gz             --checkpoint-function kernel_execve             --checkpoint-function-hit 1             --stop-after-checkpoint             --stop-on-panic             --max-steps 0             --progress-every 0             2>&1 | tee build/busybox-real-cold.log
          status=${PIPESTATUS[0]}
          set -e
          echo "BUSYBOX_REAL_COLD_STATUS=$status" | tee -a build/busybox-real-cold.log

      - name: Assert real-rootfs kernel_execve checkpoint
        run: |
          grep -F 'BOOT_EXEC_INITRAMFS path=build/busybox-real-init.cpio' build/busybox-real-cold.log
          grep -F 'BOOT_EXEC_CHECKPOINT_SAVED ' build/busybox-real-cold.log
          grep -F 'function=kernel_execve hit=1' build/busybox-real-cold.log
          test -s build/busybox-real-kernel-execve.chk.gz
          ! grep -F 'BOOT_EXEC_CHECKPOINT_RESTORED ' build/busybox-real-cold.log
          ! grep -F 'BOOT_EXEC_BLOCKED ' build/busybox-real-cold.log

      - name: Summarize real BusyBox cold boot
        if: always()
        run: |
          grep -E 'BOOT_EXEC_(STAGE|MILESTONE|INITRAMFS|CHECKPOINT_SAVED|USER_HANDOFF|USER_EXTERNAL|USER_SYSCALL|USER_EXIT|HALTED|BLOCKED)|BUSYBOX_REAL_'             build/busybox-real-cold.log | tail -520 || true

      - name: Upload real BusyBox cold evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-busybox-real-cold-${{ github.run_id }}
          path: |
            build/input-runs.env
            build/rcS
            build/busybox-real-rootfs.log
            build/busybox-real-init.cpio
            build/busybox-real-cold.log
            build/busybox-real-kernel-execve.chk.gz
          if-no-files-found: warn
          retention-days: 7

  real-software:
    needs: multicall-cold
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared             native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download exact cold rootfs and checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name "minimachine-busybox-real-cold-$GITHUB_RUN_ID"             --dir cold
          test -s cold/input-runs.env
          test -s cold/busybox-real-init.cpio
          test -s cold/busybox-real-kernel-execve.chk.gz
          cat cold/input-runs.env

      - name: Download exact Linux and BusyBox inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -a
          . cold/input-runs.env
          set +a
          test -n "$LINUX_RUN_ID"
          test -n "$BUSYBOX_RUN_ID"

          gh run download "$LINUX_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name "minimachine-linux-initramfs-$LINUX_RUN_ID"             --dir linux
          gh run download "$BUSYBOX_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name "minimachine-busybox-multicall-$BUSYBOX_RUN_ID"             --dir busybox

          test -s linux/llvm/linked.ll
          test -s linux/llvm/linux-initramfs-p3-cache.pkl.gz
          test -s busybox/busybox-multicall.bflt

      - name: Continue real BusyBox init and shell
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
          MINIMACHINE_USER_IMAGE_REFERENCE: ${{ github.workspace }}/busybox/busybox-multicall.bflt
        run: |
          set -o pipefail
          set +e
          {
            echo 'echo MINIMACHINE_REAL_EXTERNAL_BEGIN'
            echo '/bin/uname -s'
            echo '/bin/ls /etc'
            echo '/bin/cat /etc/inittab'
            echo 'echo MINIMACHINE_REAL_EXTERNAL_END'
            echo 'exit'
          } |           /usr/bin/time -f 'MINIMACHINE_REAL_SOFTWARE_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M'           timeout --signal=TERM 300           python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --program-cache-in linux/llvm/linux-initramfs-p3-cache.pkl.gz             --initramfs cold/busybox-real-init.cpio             --native-vm             --checkpoint-in cold/busybox-real-kernel-execve.chk.gz             --stop-on-panic             --max-steps 0             --progress-every 0             2>&1 | tee build/busybox-real-software.log
          status=${PIPESTATUS[1]}
          set -e
          echo "MINIMACHINE_REAL_SOFTWARE_STATUS=$status" | tee -a build/busybox-real-software.log

      - name: Report real-software frontier
        if: always()
        run: |
          echo '=== real software frontier ==='
          grep -E 'BOOT_EXEC_(CHECKPOINT_RESTORED|USER_HANDOFF|USER_EXIT|BLOCKED|HALTED)|MINIMACHINE_REAL_'             build/busybox-real-software.log | tail -420 || true
          if grep -F 'BOOT_EXEC_BLOCKED ' build/busybox-real-software.log >/dev/null; then
            echo 'MINIMACHINE_REAL_FRONTIER=blocked'
            grep -F 'BOOT_EXEC_BLOCKED ' build/busybox-real-software.log | tail -1
          elif grep -Fx 'MINIMACHINE_REAL_EXTERNAL_END' build/busybox-real-software.log >/dev/null; then
            echo 'MINIMACHINE_REAL_FRONTIER=external-software-passed'
          else
            echo 'MINIMACHINE_REAL_FRONTIER=before-external-software-end'
          fi

      - name: Assert real-software progress
        run: |
          grep -F 'BOOT_EXEC_CHECKPOINT_RESTORED ' build/busybox-real-software.log
          grep -F 'BOOT_EXEC_USER_HANDOFF ' build/busybox-real-software.log
          grep -Fx 'MINIMACHINE_REAL_BUSYBOX_RCS' build/busybox-real-software.log
          grep -Fx 'MINIMACHINE_REAL_EXTERNAL_BEGIN' build/busybox-real-software.log
          grep -Fx 'MINIMACHINE_REAL_EXTERNAL_END' build/busybox-real-software.log
          ! grep -F 'BOOT_EXEC_BLOCKED ' build/busybox-real-software.log
          grep -E '^MINIMACHINE_REAL_SOFTWARE_STATUS=(0|124)$' build/busybox-real-software.log

      - name: Upload real-software evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-busybox-real-software-${{ github.run_id }}
          path: build/busybox-real-software.log
          if-no-files-found: warn
          retention-days: 7
