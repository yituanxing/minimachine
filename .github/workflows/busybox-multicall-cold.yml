name: MiniMachine BusyBox Multicall Cold

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - scripts/build-minimachine-busybox-rootfs.py
      - .github/workflows/busybox-multicall-cold.yml

permissions:
  contents: read
  actions: read

jobs:
  multicall-cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared \
            native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download latest qualified Linux image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow initramfs-build.yml \
            --branch work/native-p3-vm \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "MINIMACHINE_LINUX_RUN=$run_id"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-linux-initramfs-$run_id" \
            --dir linux
          test -s linux/llvm/linked.ll
          test -s linux/llvm/linux-initramfs-p3-cache.pkl.gz

      - name: Download latest BusyBox multicall image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow busybox-multicall-bundle.yml \
            --branch work/native-p3-vm \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "MINIMACHINE_BUSYBOX_RUN=$run_id"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-busybox-multicall-$run_id" \
            --dir busybox
          test -s busybox/busybox-multicall.bflt

      - name: Build standard multicall rootfs
        run: |
          cat > build/init.sh <<'SH'
          #!/bin/sh
          echo BUSYBOX_MULTICALL_COLD_OK
          value=42
          echo BUSYBOX_MULTICALL_VAR_$value
          false
          echo BUSYBOX_MULTICALL_FALSE_STATUS_$?
          exit 0
          SH
          chmod +x build/init.sh

          python3 scripts/build-minimachine-busybox-rootfs.py \
            build/busybox-multicall.cpio \
            --busybox-image busybox/busybox-multicall.bflt \
            --init-script-file build/init.sh \
            2>&1 | tee build/busybox-multicall-rootfs.log

          grep -F 'BUSYBOX_ROOTFS_READY ' build/busybox-multicall-rootfs.log
          test -s build/busybox-multicall.cpio
          ls -lh build/busybox-multicall.cpio busybox/busybox-multicall.bflt

      - name: Cold boot standard BusyBox multicall rootfs
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          set -o pipefail
          set +e
          /usr/bin/time -f 'BUSYBOX_MULTICALL_COLD_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          timeout --signal=TERM 1500 \
          python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in linux/llvm/linux-initramfs-p3-cache.pkl.gz \
            --initramfs build/busybox-multicall.cpio \
            --native-vm \
            --native-boot-phases-only \
            --native-report-every 50000000 \
            --checkpoint-out build/busybox-multicall-kernel-execve.chk.gz \
            --checkpoint-function kernel_execve \
            --checkpoint-function-hit 1 \
            --stop-after-checkpoint \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee build/busybox-multicall-cold.log
          status=${PIPESTATUS[0]}
          set -e
          echo "BUSYBOX_MULTICALL_COLD_STATUS=$status" | tee -a build/busybox-multicall-cold.log

      - name: Assert current-bundle kernel_execve checkpoint
        run: |
          grep -F 'BOOT_EXEC_INITRAMFS path=build/busybox-multicall.cpio' build/busybox-multicall-cold.log
          grep -F 'BOOT_EXEC_CHECKPOINT_SAVED ' build/busybox-multicall-cold.log
          grep -F 'function=kernel_execve hit=1' build/busybox-multicall-cold.log
          test -s build/busybox-multicall-kernel-execve.chk.gz
          ! grep -F 'BOOT_EXEC_CHECKPOINT_RESTORED ' build/busybox-multicall-cold.log
          ! grep -F 'BOOT_EXEC_BLOCKED ' build/busybox-multicall-cold.log

      - name: Summarize multicall cold boot
        if: always()
        run: |
          grep -E 'BOOT_EXEC_(STAGE|MILESTONE|INITRAMFS|CHECKPOINT_SAVED|USER_HANDOFF|USER_EXTERNAL|USER_SYSCALL|USER_EXIT|HALTED|BLOCKED)|BUSYBOX_MULTICALL_' \
            build/busybox-multicall-cold.log | tail -520 || true

      - name: Upload multicall cold evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-busybox-multicall-cold-${{ github.run_id }}
          path: |
            build/busybox-multicall-cold.log
            build/busybox-multicall-rootfs.log
            build/busybox-multicall.cpio
            build/busybox-multicall-kernel-execve.chk.gz
          if-no-files-found: warn
          retention-days: 7

  real-software:
    needs: multicall-cold
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared \
            native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download latest qualified Linux image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow initramfs-build.yml \
            --branch work/native-p3-vm \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "MINIMACHINE_LINUX_RUN=$run_id"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-linux-initramfs-$run_id" \
            --dir linux

      - name: Download latest BusyBox multicall image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow busybox-multicall-bundle.yml \
            --branch work/native-p3-vm \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$run_id"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-busybox-multicall-$run_id" \
            --dir busybox

      - name: Download fresh cold checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-busybox-multicall-cold-$GITHUB_RUN_ID" \
            --dir cold
          test -s cold/busybox-multicall-kernel-execve.chk.gz
          test -s cold/busybox-multicall.cpio

      - name: Build real BusyBox init rootfs
        run: |
          cat > build/rcS <<'SH'
          #!/bin/sh
          PATH=/bin
          export PATH
          echo MINIMACHINE_REAL_BUSYBOX_RCS
          exec /bin/sh
          SH
          chmod +x build/rcS

          python3 scripts/build-minimachine-busybox-rootfs.py \
            build/busybox-real-init.cpio \
            --busybox-image busybox/busybox-multicall.bflt \
            --busybox-init \
            --rc-script-file build/rcS \
            2>&1 | tee build/busybox-real-rootfs.log

          grep -F 'mode=busybox-init' build/busybox-real-rootfs.log
          test -s build/busybox-real-init.cpio

      - name: Run real BusyBox init and shell
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
          MINIMACHINE_USER_IMAGE_REFERENCE: ${{ github.workspace }}/busybox/busybox-multicall.bflt
        run: |
          set -o pipefail
          set +e
          {
            echo 'echo MINIMACHINE_REAL_EXTERNAL_BEGIN'
            echo '/bin/uname -s'
            echo '/bin/ls /etc'
            echo '/bin/cat /etc/inittab'
            echo 'echo MINIMACHINE_REAL_EXTERNAL_END'
          } | \
          /usr/bin/time -f 'MINIMACHINE_REAL_SOFTWARE_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          timeout --signal=TERM 300 \
          python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in linux/llvm/linux-initramfs-p3-cache.pkl.gz \
            --initramfs cold/busybox-multicall.cpio \
            --native-vm \
            --checkpoint-in cold/busybox-multicall-kernel-execve.chk.gz \
            --inject-initramfs-cpio build/busybox-real-init.cpio \
            --restart-run-init-after-checkpoint \
            --restart-init-path /init \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee build/busybox-real-software.log
          status=${PIPESTATUS[1]}
          set -e
          echo "MINIMACHINE_REAL_SOFTWARE_STATUS=$status" | tee -a build/busybox-real-software.log

      - name: Report real-software frontier
        if: always()
        run: |
          echo '=== real software frontier ==='
          grep -E 'BOOT_EXEC_(CHECKPOINT_RESTORED|ROOTFS|INIT_EXEC_RESTART|USER_HANDOFF|USER_EXIT|BLOCKED|HALTED)|MINIMACHINE_REAL_' \
            build/busybox-real-software.log | tail -420 || true
          if grep -F 'BOOT_EXEC_BLOCKED ' build/busybox-real-software.log >/dev/null; then
            echo 'MINIMACHINE_REAL_FRONTIER=blocked'
            grep -F 'BOOT_EXEC_BLOCKED ' build/busybox-real-software.log | tail -1
          elif grep -Fx 'MINIMACHINE_REAL_EXTERNAL_END' build/busybox-real-software.log >/dev/null; then
            echo 'MINIMACHINE_REAL_FRONTIER=external-software-passed'
          else
            echo 'MINIMACHINE_REAL_FRONTIER=before-external-software-end'
          fi

      - name: Assert real-software progress
        run: |
          grep -F 'BOOT_EXEC_CHECKPOINT_RESTORED ' build/busybox-real-software.log
          grep -F 'BOOT_EXEC_USER_HANDOFF ' build/busybox-real-software.log
          grep -Fx 'MINIMACHINE_REAL_BUSYBOX_RCS' build/busybox-real-software.log
          grep -Fx 'MINIMACHINE_REAL_EXTERNAL_BEGIN' build/busybox-real-software.log
          grep -Fx 'MINIMACHINE_REAL_EXTERNAL_END' build/busybox-real-software.log
          ! grep -F 'BOOT_EXEC_BLOCKED ' build/busybox-real-software.log
          grep -E '^MINIMACHINE_REAL_SOFTWARE_STATUS=(0|124)$' build/busybox-real-software.log

      - name: Upload real-software evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-busybox-real-software-${{ github.run_id }}
          path: |
            build/busybox-real-rootfs.log
            build/busybox-real-init.cpio
            build/busybox-real-software.log
          if-no-files-found: warn
          retention-days: 7
