name: MiniMachine BusyBox Multicall Cold

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - scripts/build-minimachine-busybox-rootfs.py
      - .github/workflows/busybox-multicall-cold.yml

permissions:
  contents: read
  actions: read

jobs:
  multicall-cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared \
            native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download 64 MiB Linux image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33348074309
          github-token: ${{ github.token }}
          name: minimachine-linux-initramfs-33348074309
          path: linux

      - name: Download BusyBox multicall image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33347461389
          github-token: ${{ github.token }}
          name: minimachine-busybox-multicall-33347461389
          path: busybox

      - name: Build standard multicall rootfs
        run: |
          cat > build/init.sh <<'SH'
          #!/bin/sh
          echo BUSYBOX_MULTICALL_COLD_OK
          value=42
          echo BUSYBOX_MULTICALL_VAR_$value
          false
          echo BUSYBOX_MULTICALL_FALSE_STATUS_$?
          exit 0
          SH
          chmod +x build/init.sh

          python3 scripts/build-minimachine-busybox-rootfs.py \
            build/busybox-multicall.cpio \
            --busybox-image busybox/busybox-multicall.bflt \
            --init-script-file build/init.sh \
            2>&1 | tee build/busybox-multicall-rootfs.log

          grep -F 'BUSYBOX_ROOTFS_READY ' build/busybox-multicall-rootfs.log
          test -s build/busybox-multicall.cpio
          test -s linux/llvm/linked.ll
          test -s linux/llvm/linux-initramfs-p3-cache.pkl.gz
          ls -lh build/busybox-multicall.cpio busybox/busybox-multicall.bflt

      - name: Cold boot standard BusyBox multicall rootfs
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          set -o pipefail
          set +e
          /usr/bin/time -f 'BUSYBOX_MULTICALL_COLD_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          timeout --signal=TERM 1500 \
          python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in linux/llvm/linux-initramfs-p3-cache.pkl.gz \
            --initramfs build/busybox-multicall.cpio \
            --native-vm \
            --native-boot-phases-only \
            --native-report-every 50000000 \
            --checkpoint-out build/busybox-multicall-kernel-execve.chk.gz \
            --checkpoint-function kernel_execve \
            --checkpoint-function-hit 1 \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee build/busybox-multicall-cold.log
          status=${PIPESTATUS[0]}
          set -e
          echo "BUSYBOX_MULTICALL_COLD_STATUS=$status" | tee -a build/busybox-multicall-cold.log

      - name: Assert standard multicall shell
        run: |
          grep -F 'BOOT_EXEC_INITRAMFS path=build/busybox-multicall.cpio' build/busybox-multicall-cold.log
          grep -F 'BOOT_EXEC_USER_HANDOFF ' build/busybox-multicall-cold.log
          grep -F 'function=__mm_user_main functions=3043' build/busybox-multicall-cold.log
          grep -Fx 'BUSYBOX_MULTICALL_COLD_OK' build/busybox-multicall-cold.log
          grep -Fx 'BUSYBOX_MULTICALL_VAR_42' build/busybox-multicall-cold.log
          grep -Fx 'BUSYBOX_MULTICALL_FALSE_STATUS_1' build/busybox-multicall-cold.log
          grep -F 'BOOT_EXEC_USER_EXIT status=0' build/busybox-multicall-cold.log
          grep -F 'BUSYBOX_MULTICALL_COLD_STATUS=0' build/busybox-multicall-cold.log
          ! grep -F 'BOOT_EXEC_CHECKPOINT_RESTORED ' build/busybox-multicall-cold.log
          ! grep -F 'BOOT_EXEC_ROOTFS_INJECTED ' build/busybox-multicall-cold.log
          ! grep -F 'BOOT_EXEC_BLOCKED ' build/busybox-multicall-cold.log

      - name: Summarize multicall cold boot
        if: always()
        run: |
          grep -E 'BOOT_EXEC_(STAGE|MILESTONE|INITRAMFS|CHECKPOINT_SAVED|USER_HANDOFF|USER_EXTERNAL|USER_SYSCALL|USER_VSNPRINTF|USER_ATOI|USER_EXIT|HALTED|BLOCKED)|BUSYBOX_MULTICALL_' \
            build/busybox-multicall-cold.log | tail -520 || true

      - name: Upload multicall cold evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-busybox-multicall-cold-${{ github.run_id }}
          path: |
            build/busybox-multicall-cold.log
            build/busybox-multicall-rootfs.log
            build/busybox-multicall-kernel-execve.chk.gz
          if-no-files-found: warn
          retention-days: 7
