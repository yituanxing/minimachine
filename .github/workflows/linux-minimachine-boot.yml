name: Linux MiniMachine Boot Gate

on:
  push:
    branches: [main, "work/user-transition"]
    paths:
      - configs/linux-6.6.143-minimachine.env
      - linux-overlay/arch/minimachine/**
      - scripts/check-minimachine-boot.sh
      - .github/workflows/linux-minimachine-boot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minimachine-linux-boot-gate-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CACHE_ROOT: ${{ github.workspace }}/.cache/minimachine
      BUILD_ROOT: ${{ github.workspace }}/build/linux-6.6.143-minimachine-boot
    steps:
      - uses: actions/checkout@v4

      - name: Install boot-gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18 xz-utils

      - name: Restore pinned Linux archive
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/minimachine/source/linux-6.6.143.tar.xz
          key: minimachine-linux-source-6.6.143-dace1f8dc9c0dbf5

      - name: Restore incremental boot objects
        uses: actions/cache/restore@v4
        with:
          path: build/linux-6.6.143-minimachine-boot/out
          key: minimachine-linux-boot-out-v1-${{ github.sha }}
          restore-keys: |
            minimachine-linux-boot-out-v1-

      - name: Build native MiniMachine vmlinux
        run: bash scripts/check-minimachine-boot.sh

      - name: Save incremental boot objects
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/linux-6.6.143-minimachine-boot/out
          key: minimachine-linux-boot-out-v1-${{ github.sha }}

      - name: Save pinned Linux archive
        if: always() && steps.source-cache.outputs.cache-hit != 'true' && hashFiles('.cache/minimachine/source/linux-6.6.143.tar.xz') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/minimachine/source/linux-6.6.143.tar.xz
          key: minimachine-linux-source-6.6.143-dace1f8dc9c0dbf5

      - name: Upload boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-linux-boot-${{ github.run_id }}
          path: |
            build/linux-6.6.143-minimachine-boot/out/.config
            build/linux-6.6.143-minimachine-boot/out/vmlinux
            build/linux-6.6.143-minimachine-boot/boot-build.log
            build/linux-6.6.143-minimachine-boot/llvm/linked.bc
            build/linux-6.6.143-minimachine-boot/llvm/linked.ll
            build/linux-6.6.143-minimachine-boot/llvm/executable.json
            build/linux-6.6.143-minimachine-boot/llvm/boot-exec.log
          if-no-files-found: ignore
          retention-days: 14
