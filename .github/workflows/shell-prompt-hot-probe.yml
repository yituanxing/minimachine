name: MiniMachine Shell Prompt Hot Probe

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - scripts/build-minimachine-shell.py
      - scripts/run-minimachine-linux.py
      - src/minimachine/checkpoint.py
      - src/minimachine/native_vm.py
      - native/p3vm.c
      - .github/workflows/shell-prompt-hot-probe.yml

permissions:
  contents: read
  actions: read

jobs:
  prompt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build native VM and shell probe
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared native/p3vm.c -o build/libminimachine_p3vm.so
          python3 scripts/build-minimachine-shell.py build/mmsh-prompt.bflt --mode prompt-probe
          ls -lh build/mmsh-prompt.bflt

      - name: Download exact Linux image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33264250619
          github-token: ${{ github.token }}
          name: minimachine-linux-initramfs-33264250619
          path: exact

      - name: Download kernel_execve hotspot
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33294699007
          github-token: ${{ github.token }}
          name: minimachine-native-exec-hot-33294699007
          path: hot

      - name: Hot inject shell and run userspace write
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          set -o pipefail
          /usr/bin/time -f 'SHELL_PROMPT_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          python3 scripts/run-minimachine-linux.py exact/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in hot/exec-hot-p3-cache.pkl.gz \
            --initramfs exact/out/minimachine-initramfs.cpio \
            --native-vm \
            --checkpoint-in hot/kernel-execve-hot.chk.gz \
            --inject-init build/mmsh-prompt.bflt \
            --max-steps 5000000 \
            --progress-every 0 \
            2>&1 | tee hot/shell-prompt.log

      - name: Summarize shell prompt probe
        if: always()
        run: |
          grep -E 'MINIMACHINE_SHELL_READY|BOOT_EXEC_(CHECKPOINT_RESTORED|HOST_DESCRIPTORS_REFRESHED|ROOTFS_INJECTED|USER_HANDOFF|USER_SYSCALL|HALTED|BLOCKED)|mmsh>|SHELL_PROMPT_WALL' \
            hot/shell-prompt.log build/mmsh-prompt.bflt 2>/dev/null || true

      - name: Upload shell probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-shell-prompt-${{ github.run_id }}
          path: hot/shell-prompt.log
          retention-days: 7
