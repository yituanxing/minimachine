name: Linux MiniMachine Checkpoint Resume Proof

on:
  push:
    branches: [work/checkpoint-after-kallsyms]
    paths:
      - .github/workflows/checkpoint-resume-proof.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: minimachine-checkpoint-resume-proof
  cancel-in-progress: true

jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download proven pty checkpoint
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33248074874
          github-token: ${{ github.token }}
          name: minimachine-linux-replay-33248074874
          path: checkpoint-source

      - name: Find matching default-defconfig Linux LLVM artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/linux-minimachine-boot.yml/runs?status=completed&per_page=30"               --jq '.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main") | .id' |
              head -n 1
          )"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "RESUME_SOURCE_RUN $run_id"

      - name: Download linked Linux LLVM image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: minimachine-linux-boot-*
          path: replay-source
          merge-multiple: true

      - name: Verify checkpoint inputs
        run: |
          checkpoint="$(find checkpoint-source -name 'pty-init.chk.gz' -print -quit)"
          test -n "$checkpoint"
          test -s "$checkpoint"
          test -s replay-source/llvm/linked.ll
          cp "$checkpoint" replay-source/llvm/pty-init.chk.gz
          echo "CHECKPOINT_BYTES $(stat -c%s replay-source/llvm/pty-init.chk.gz)"

      - name: Resume to the cold-run 130M boundary
        run: |
          set -o pipefail
          python3 scripts/run-minimachine-linux.py replay-source/llvm/linked.ll             --linker-contract configs/linux-6.6.143-minimachine-linker.json             --checkpoint-in replay-source/llvm/pty-init.chk.gz             --checkpoint-initcall pty_init             --max-steps 18447734             --progress-every 0             2>&1 | tee replay-source/llvm/resume-proof.log
          status=${PIPESTATUS[0]}
          test "$status" -eq 1
          grep -F 'BOOT_EXEC_CHECKPOINT_RESTORED path=replay-source/llvm/pty-init.chk.gz steps=111552266' replay-source/llvm/resume-proof.log
          grep -F 'BOOT_EXEC_CHECKPOINT_BUDGET saved_steps=111552266 additional_steps=18447734 absolute_limit=130000000' replay-source/llvm/resume-proof.log
          grep -F 'BOOT_EXEC_BLOCKED stage=execute steps=130000000 function=next_tid.23944 block=entry.__abi_cont4 ip=8 sp=0xfeff35d8 error=step limit exceeded: 130000000' replay-source/llvm/resume-proof.log

      - name: Upload resume proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-checkpoint-resume-proof-${{ github.run_id }}
          path: replay-source/llvm/resume-proof.log
          if-no-files-found: ignore
          retention-days: 14
