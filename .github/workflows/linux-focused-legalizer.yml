name: Linux Focused Legalizer

on:
  push:
    branches: [main]
    paths:
      - src/minimachine/**
      - scripts/legalize_bc.py
      - scripts/focus_corpus.py
      - scripts/normalize-corpus.sh
      - .github/workflows/linux-focused-legalizer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minimachine-linux-focused-legalizer
  cancel-in-progress: true

jobs:
  focused16:
    runs-on: ubuntu-24.04
    env:
      ROOT: ${{ github.workspace }}/build/focused
      FULL: ${{ github.workspace }}/build/linux-6.6.143-riscv-full-all/full-all-corpus
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-18 clang-18
          echo "nproc=$(nproc)"

      - name: Restore focused16 cache
        id: focused-cache
        uses: actions/cache/restore@v4
        with:
          path: build/focused/raw
          key: minimachine-focused16-v1-${{ hashFiles('scripts/focus_corpus.py', 'configs/linux-6.6.143-riscv.env') }}

      - name: Restore full-all cache
        if: steps.focused-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: build/linux-6.6.143-riscv-full-all/full-all-corpus
          key: minimachine-linux-6.6.143-riscv-defconfig-llvm18-full-all-v1-${{ hashFiles('configs/linux-6.6.143-riscv.env', 'scripts/materialize-linux.sh', 'scripts/select-corpus.py', 'scripts/export-corpus.py') }}
          restore-keys: |
            minimachine-linux-6.6.143-riscv-defconfig-llvm18-full-all-v1-

      - name: Select focused16
        if: steps.focused-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          python3 scripts/focus_corpus.py --input "$FULL" --output "$ROOT/raw" --count 16

      - name: Save focused16 cache
        if: steps.focused-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/focused/raw
          key: minimachine-focused16-v1-${{ hashFiles('scripts/focus_corpus.py', 'configs/linux-6.6.143-riscv.env') }}

      - name: Verify focused16
        run: |
          set -Eeuo pipefail
          test "$(find "$ROOT/raw" -type f -name '*.bc' | wc -l)" -eq 16
          cat "$ROOT/raw/focused.txt"

      - name: Normalize focused16
        run: |
          set -Eeuo pipefail
          JOBS="$(nproc)" bash scripts/normalize-corpus.sh "$ROOT/raw" "$ROOT/normalized"

      - name: Legalize focused16 to μIR
        run: |
          set -Eeuo pipefail
          mkdir -p "$ROOT/reports"
          python3 scripts/legalize_bc.py "$ROOT/normalized" \
            --llvm-major 18 \
            --json "$ROOT/reports/legalize.json"

      - name: Focused summary
        run: |
          python3 - <<'PY'
          import json
          p="build/focused/reports/legalize.json"
          r=json.load(open(p))
          print(f"FOCUSED16 pass={r['pass']}/16 fail={r['fail']}")
          for x in r["records"]:
              if x["status"]=="FAIL":
                  print(f"FAIL {x['file']} :: {x['error']}")
          PY

      - name: Upload focused report
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-focused16-${{ github.run_id }}
          path: |
            build/focused/raw/focused.txt
            build/focused/reports/legalize.json
          retention-days: 14
