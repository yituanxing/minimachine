name: MiniMachine SQLite Real Software

on:
  workflow_dispatch:
  push:
    branches: [work/sqlite-real-software]
    paths:
      - src/minimachine/user_bundle.py
      - src/minimachine/user_image.py
      - src/minimachine/legalize.py
      - src/minimachine/llvm_text.py
      - native/p3vm.c
      - scripts/build-minimachine-user-program.py
      - scripts/build-minimachine-program-rootfs.py
      - scripts/build-minimachine-busybox-rootfs.py
      - scripts/run-minimachine-linux.py
      - tests/test_user_bundle.py
      - tests/test_user_namespace.py
      - tests/test_llvm_fence.py
      - .github/workflows/sqlite-real-software.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: sqlite-real-software-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SQLITE_VERSION: "3.53.4"
      SQLITE_VERSION_NUMBER: "3530400"
      SQLITE_AUTOCONF_SHA3_256: "454e45f61c6bd75b7420e7190732dea03ce6639c63ada47bbc592f67fc340338"
    steps:
      - uses: actions/checkout@v4

      - name: Install cross and LLVM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user \
            clang-18 llvm-18 lld-18

      - name: Validate generic user-program namespace contracts
        run: |
          python3 -m unittest \
            tests.test_user_bundle \
            tests.test_user_namespace \
            tests.test_llvm_fence \
            -v
          python3 -m py_compile scripts/build-minimachine-user-program.py

      - name: Fetch pinned upstream SQLite
        run: |
          mkdir -p build
          tarball="sqlite-autoconf-${SQLITE_VERSION_NUMBER}.tar.gz"
          curl -fL --retry 5 --retry-delay 2 \
            -o "build/$tarball" \
            "https://www.sqlite.org/2026/$tarball"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          version = os.environ["SQLITE_VERSION_NUMBER"]
          expected = os.environ["SQLITE_AUTOCONF_SHA3_256"]
          path = Path(f"build/sqlite-autoconf-{version}.tar.gz")
          actual = hashlib.sha3_256(path.read_bytes()).hexdigest()
          print(f"SQLITE_SOURCE_SHA3_256={actual}")
          if actual != expected:
              raise SystemExit(f"SQLite source hash mismatch: {actual} != {expected}")
          PY
          tar -xzf "build/$tarball" -C build
          printf 'version=%s\nversion_number=%s\nsha3_256=%s\n' \
            "$SQLITE_VERSION" "$SQLITE_VERSION_NUMBER" "$SQLITE_AUTOCONF_SHA3_256" \
            | tee build/sqlite-source.txt
          test -s "build/sqlite-autoconf-${SQLITE_VERSION_NUMBER}/sqlite3.c"
          test -s "build/sqlite-autoconf-${SQLITE_VERSION_NUMBER}/shell.c"

      - name: Build and run normal RISC-V SQLite baseline
        run: |
          src="build/sqlite-autoconf-${SQLITE_VERSION_NUMBER}"
          riscv64-linux-gnu-gcc \
            -O2 -std=gnu11 -I"$src" \
            "$src/shell.c" "$src/sqlite3.c" \
            -lm -ldl -lpthread \
            -o build/sqlite3-riscv64

          rm -f build/sqlite-baseline.db
          qemu-riscv64 -L /usr/riscv64-linux-gnu \
            build/sqlite3-riscv64 -batch -noheader build/sqlite-baseline.db \
            > build/sqlite-riscv-create.txt <<'SQL'
          CREATE TABLE mm(id INTEGER PRIMARY KEY, n INTEGER NOT NULL, s TEXT NOT NULL);
          INSERT INTO mm(n,s) VALUES(7,'alpha'),(11,'beta'),(13,'gamma');
          SELECT 'SQLITE_RISCV_CREATE', sqlite_version(), count(*), sum(n) FROM mm;
          SQL
          cat build/sqlite-riscv-create.txt
          grep -F 'SQLITE_RISCV_CREATE|3.53.4|3|31' build/sqlite-riscv-create.txt
          test -s build/sqlite-baseline.db

          qemu-riscv64 -L /usr/riscv64-linux-gnu \
            build/sqlite3-riscv64 -batch -noheader build/sqlite-baseline.db \
            > build/sqlite-riscv-reopen.txt <<'SQL'
          SELECT 'SQLITE_RISCV_REOPEN', count(*), sum(n), group_concat(s, ',') FROM mm;
          SQL
          cat build/sqlite-riscv-reopen.txt
          grep -F 'SQLITE_RISCV_REOPEN|3|31|alpha,beta,gamma' build/sqlite-riscv-reopen.txt

      - name: Build whole-program RISC-V LLVM LTO image
        run: |
          src="build/sqlite-autoconf-${SQLITE_VERSION_NUMBER}"
          clang-18 \
            --target=riscv64-linux-gnu \
            --sysroot=/usr/riscv64-linux-gnu \
            --gcc-toolchain=/usr \
            -O2 -std=gnu11 -I"$src" \
            -flto=full \
            "$src/shell.c" "$src/sqlite3.c" \
            -fuse-ld=lld -Wl,--sysroot=/ -Wl,--save-temps -Wl,-E \
            -L/usr/riscv64-linux-gnu/lib -lm -ldl -lpthread \
            -o build/sqlite3-lto

          find build -maxdepth 2 -type f -name '*.bc' -printf '%p %s\n' \
            | sort | tee build/sqlite-lto-files.txt
          opt_bc="$(find build -maxdepth 2 -type f -name '*.opt.bc' -print | head -1)"
          test -n "$opt_bc"
          test -s "$opt_bc"
          llvm-dis-18 "$opt_bc" -o build/sqlite-whole.ll
          test -s build/sqlite-whole.ll

      - name: Lower complete SQLite CLI to MiniMachine bundle
        run: |
          set -o pipefail
          /usr/bin/time -f 'SQLITE_MINIMACHINE_BUNDLE_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
            python3 scripts/build-minimachine-user-program.py \
              build/sqlite-whole.ll \
              build/sqlite3534.bflt \
              --entry main \
              --namespace sqlite3534 \
              --entry-args linux-main \
              --stack-size 0x200000 \
              --report build/sqlite3534-bundle.json \
              2>&1 | tee build/sqlite3534-bundle.log

          grep -F 'USER_BUNDLE namespace=sqlite3534 entry=__mm_sqlite3534_main ' \
            build/sqlite3534-bundle.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build/sqlite3534-bundle.json").read_text())
          print(
              "SQLITE_MINIMACHINE_GATE "
              f"entry={report['entry_namespaced']} "
              f"functions={report['functions']} "
              f"externals={len(report['external_functions'])} "
              f"helpers={report['runtime_helpers']} "
              f"objects={report['global_objects']} "
              f"relocs={report['relocations']} "
              f"payload={report['compressed_payload_bytes']}"
          )
          assert report["namespace"] == "sqlite3534"
          assert report["entry_namespaced"] == "__mm_sqlite3534_main"
          assert report["functions"] > 100
          assert report["payload_under_16m"]
          PY

      - name: Report SQLite semantic surface
        if: always()
        run: |
          echo '=== SQLite source ==='
          cat build/sqlite-source.txt || true
          echo '=== native RISC-V create ==='
          cat build/sqlite-riscv-create.txt || true
          echo '=== native RISC-V reopen ==='
          cat build/sqlite-riscv-reopen.txt || true
          echo '=== MiniMachine bundle ==='
          grep -E '^(USER_BUNDLE|USER_EXTERNAL_FUNCTION|USER_EXTERNAL_DATA|SQLITE_MINIMACHINE_)' \
            build/sqlite3534-bundle.log | tail -320 || true

      - name: Upload SQLite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-sqlite3534-${{ github.run_id }}
          path: |
            build/sqlite-source.txt
            build/sqlite-riscv-create.txt
            build/sqlite-riscv-reopen.txt
            build/sqlite-lto-files.txt
            build/sqlite-whole.ll
            build/sqlite3534.bflt
            build/sqlite3534-bundle.json
            build/sqlite3534-bundle.log
          if-no-files-found: warn
          retention-days: 14

  sqlite-runtime:
    needs: sqlite-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared \
            native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download SQLite bundle from this run
        uses: actions/download-artifact@v4
        with:
          name: minimachine-sqlite3534-${{ github.run_id }}
          path: sqlite

      - name: Download frozen BusyBox multicall image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33396890631
          github-token: ${{ github.token }}
          name: minimachine-busybox-multicall-33396890631
          path: busybox

      - name: Download latest qualified Linux image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow initramfs-build.yml \
            --branch work/native-p3-vm \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "SQLITE_RUNTIME_LINUX_RUN=$run_id" | tee build/sqlite-runtime-inputs.txt
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "minimachine-linux-initramfs-$run_id" \
            --dir linux
          test -s linux/llvm/linked.ll
          test -s linux/out/minimachine-initramfs.cpio

      - name: Build current-lowering Linux P3 cache
        run: |
          set -o pipefail
          set +e
          python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --initramfs linux/out/minimachine-initramfs.cpio \
            --program-cache-out build/linux-current-p3-cache.pkl.gz \
            --probe-kallsyms start_kernel \
            --max-steps 1 \
            2>&1 | tee build/linux-current-cache.log
          status=${PIPESTATUS[0]}
          set -e
          grep -F 'BOOT_EXEC_PROGRAM_CACHE_SAVED path=build/linux-current-p3-cache.pkl.gz' \
            build/linux-current-cache.log
          test -s build/linux-current-p3-cache.pkl.gz
          if [ "$status" -ne 0 ]; then
            grep -F 'step limit exceeded: 1' build/linux-current-cache.log
          fi

      - name: Build BusyBox plus SQLite persistence rootfs
        run: |
          test -s sqlite/sqlite3534.bflt
          test -s busybox/busybox-multicall.bflt
          sha256sum \
            sqlite/sqlite3534.bflt \
            busybox/busybox-multicall.bflt \
            >> build/sqlite-runtime-inputs.txt

          cat > build/sqlite-rcS.sh <<'SH'
          #!/bin/sh
          PATH=/bin
          export PATH
          rm -f /tmp/mm.db
          echo SQLITE_MINIMACHINE_BEGIN
          /bin/sqlite3 -batch -noheader /tmp/mm.db <<'SQL'
          CREATE TABLE mm(id INTEGER PRIMARY KEY, n INTEGER NOT NULL, s TEXT NOT NULL);
          INSERT INTO mm(n,s) VALUES(7,'alpha'),(11,'beta'),(13,'gamma');
          SELECT 'SQLITE_MINIMACHINE_CREATE', sqlite_version(), count(*), sum(n) FROM mm;
          SQL
          echo SQLITE_MINIMACHINE_FIRST_EXIT_$?
          /bin/sqlite3 -batch -noheader /tmp/mm.db <<'SQL'
          SELECT 'SQLITE_MINIMACHINE_REOPEN', count(*), sum(n), group_concat(s, ',') FROM mm;
          SQL
          echo SQLITE_MINIMACHINE_SECOND_EXIT_$?
          test -s /tmp/mm.db
          echo SQLITE_MINIMACHINE_DONE
          exit 0
          SH
          chmod +x build/sqlite-rcS.sh

          python3 scripts/build-minimachine-busybox-rootfs.py \
            build/sqlite-rootfs.cpio \
            --busybox-image busybox/busybox-multicall.bflt \
            --busybox-init \
            --rc-script-file build/sqlite-rcS.sh \
            --extra-program sqlite/sqlite3534.bflt /bin/sqlite3 \
            2>&1 | tee build/sqlite-rootfs.log

          grep -F 'BUSYBOX_ROOTFS_READY ' build/sqlite-rootfs.log
          grep -F 'mode=busybox-init ' build/sqlite-rootfs.log
          grep -F 'extra_programs=1' build/sqlite-rootfs.log
          grep -F 'BUSYBOX_ROOTFS_EXTRA_PROGRAM guest=/bin/sqlite3 ' \
            build/sqlite-rootfs.log
          test -s build/sqlite-rootfs.cpio

      - name: Cold boot SQLite rootfs to first exec boundary
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          set -o pipefail
          set +e
          /usr/bin/time -f 'SQLITE_COLD_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          timeout --signal=TERM 1500 \
          python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in build/linux-current-p3-cache.pkl.gz \
            --initramfs build/sqlite-rootfs.cpio \
            --native-vm \
            --native-boot-phases-only \
            --native-report-every 50000000 \
            --checkpoint-out build/sqlite-kernel-execve.chk.gz \
            --checkpoint-function kernel_execve \
            --checkpoint-function-hit 1 \
            --stop-after-checkpoint \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee build/sqlite-cold.log
          status=${PIPESTATUS[0]}
          set -e
          echo "SQLITE_COLD_STATUS=$status" | tee -a build/sqlite-cold.log

      - name: Assert SQLite exec checkpoint
        run: |
          grep -F 'BOOT_EXEC_CHECKPOINT_SAVED ' build/sqlite-cold.log
          grep -F 'function=kernel_execve hit=1' build/sqlite-cold.log
          test -s build/sqlite-kernel-execve.chk.gz
          ! grep -F 'BOOT_EXEC_BLOCKED ' build/sqlite-cold.log

      - name: Execute SQLite create exit reopen workload
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          set -o pipefail
          set +e
          /usr/bin/time -f 'SQLITE_RUNTIME_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          timeout --signal=TERM 900 \
          python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in build/linux-current-p3-cache.pkl.gz \
            --initramfs build/sqlite-rootfs.cpio \
            --native-vm \
            --checkpoint-in build/sqlite-kernel-execve.chk.gz \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee build/sqlite-runtime.log
          status=${PIPESTATUS[0]}
          set -e
          echo "SQLITE_RUNTIME_STATUS=$status" | tee -a build/sqlite-runtime.log

      - name: Report SQLite runtime frontier
        if: always()
        run: |
          grep -E \
            'BOOT_EXEC_(CHECKPOINT_RESTORED|USER_HANDOFF|USER_EXTERNAL|USER_SYSCALL|USER_EXIT|BLOCKED|HALTED)|SQLITE_' \
            build/sqlite-runtime.log | tail -520 || true
          if grep -F 'BOOT_EXEC_BLOCKED ' build/sqlite-runtime.log >/dev/null; then
            echo SQLITE_RUNTIME_FRONTIER=blocked
            grep -F 'BOOT_EXEC_BLOCKED ' build/sqlite-runtime.log | tail -1
          elif grep -F 'SQLITE_MINIMACHINE_DONE' build/sqlite-runtime.log >/dev/null; then
            echo SQLITE_RUNTIME_FRONTIER=persistence-complete
          else
            echo SQLITE_RUNTIME_FRONTIER=before-persistence-complete
          fi

      - name: Assert real SQLite persistence
        run: |
          grep -F 'BOOT_EXEC_CHECKPOINT_RESTORED ' build/sqlite-runtime.log
          grep -F 'BOOT_EXEC_USER_HANDOFF ' build/sqlite-runtime.log
          grep -F 'SQLITE_MINIMACHINE_BEGIN' build/sqlite-runtime.log
          grep -F 'SQLITE_MINIMACHINE_CREATE|3.53.4|3|31' build/sqlite-runtime.log
          grep -F 'SQLITE_MINIMACHINE_FIRST_EXIT_0' build/sqlite-runtime.log
          grep -F 'SQLITE_MINIMACHINE_REOPEN|3|31|alpha,beta,gamma' build/sqlite-runtime.log
          grep -F 'SQLITE_MINIMACHINE_SECOND_EXIT_0' build/sqlite-runtime.log
          grep -F 'SQLITE_MINIMACHINE_DONE' build/sqlite-runtime.log
          grep -F 'SQLITE_RUNTIME_STATUS=0' build/sqlite-runtime.log
          ! grep -F 'BOOT_EXEC_BLOCKED ' build/sqlite-runtime.log

      - name: Upload SQLite runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-sqlite3534-runtime-${{ github.run_id }}
          path: |
            build/sqlite-runtime-inputs.txt
            build/linux-current-cache.log
            build/sqlite-rcS.sh
            build/sqlite-rootfs.log
            build/sqlite-rootfs.cpio
            build/sqlite-cold.log
            build/sqlite-runtime.log
          if-no-files-found: warn
          retention-days: 14
