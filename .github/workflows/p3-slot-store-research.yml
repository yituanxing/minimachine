name: P3 Slot Store Research

on:
  push:
    branches: [research/p3-slot-store]
    paths:
      - scripts/analyze-p3-slot-coloring.py
      - .github/workflows/p3-slot-store-research.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen Linux P3 cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh run download 33635973925 \
            --repo "$GITHUB_REPOSITORY" \
            --name minimachine-linux-p3-console-current-33635973925 \
            --dir input
          test -s input/linux-initramfs-p3-cache-full-current.pkl.gz
          ls -lh input/linux-initramfs-p3-cache-full-current.pkl.gz

      - name: Analyze call-aware Slot coloring
        env:
          PYTHONPATH: .
        run: |
          /usr/bin/time -v \
            python3 scripts/analyze-p3-slot-coloring.py \
              input/linux-initramfs-p3-cache-full-current.pkl.gz \
              --out slot-coloring.json \
            2>&1 | tee slot-coloring.log
          grep -F 'SLOT_ANALYZE_RESULT ' slot-coloring.log
          test -s slot-coloring.json

      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: p3-slot-store-research-${{ github.run_id }}
          path: |
            slot-coloring.json
            slot-coloring.log
          retention-days: 14
