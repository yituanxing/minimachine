name: MiniMachine BusyBox Ash Restart Hot

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - native/p3vm.c
      - scripts/run-minimachine-linux.py
      - src/minimachine/native_vm.py
      - src/minimachine/runtime.py
      - .github/workflows/busybox-ash-restart-hot.yml

concurrency:
  group: busybox-ash-restart-hot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  ash-restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared \
            native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download current 64 MiB Linux image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33348074309
          github-token: ${{ github.token }}
          name: minimachine-linux-initramfs-33348074309
          path: linux

      - name: Download current-lowering Linux P3 cache
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33399276976
          github-token: ${{ github.token }}
          name: minimachine-linux-p3-console-current-33399276976
          path: current-cache

      - name: Download full defconfig BusyBox bundle
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33313986393
          github-token: ${{ github.token }}
          name: minimachine-busybox-bundle-33313986393
          path: defconfig

      - name: Download current defconfig kernel_execve checkpoint
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33348461525
          github-token: ${{ github.token }}
          name: minimachine-busybox-defconfig-cold-33348461525
          path: defcold

      - name: Rebuild exact defconfig initramfs
        run: |
          python3 scripts/build-minimachine-initramfs.py \
            build/busybox-defconfig.cpio \
            --init-image defconfig/busybox-ash.bflt
          test -s defcold/busybox-defconfig-kernel-execve.chk.gz

      - name: Restart fresh init exec and run ash
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          set -o pipefail
          set +e
          printf 'echo BUSYBOX_MINIMACHINE_HELLO\nvalue=42\necho BUSYBOX_VAR_$value\nfalse\necho BUSYBOX_FALSE_STATUS_$?\nexit 0\n' | \
          /usr/bin/time -f 'ASH_RESTART_HOT_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          timeout --signal=TERM 300 \
          python3 scripts/run-minimachine-linux.py linux/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in current-cache/linux-initramfs-p3-cache-full-current.pkl.gz \
            --initramfs build/busybox-defconfig.cpio \
            --native-vm \
            --checkpoint-in defcold/busybox-defconfig-kernel-execve.chk.gz \
            --restart-run-init-after-checkpoint \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee build/ash-restart-hot.log
          status=${PIPESTATUS[1]}
          set -e
          echo "ASH_RESTART_HOT_STATUS=$status" | tee -a build/ash-restart-hot.log

      - name: Assert real BusyBox handoff
        run: |
          grep -F 'BOOT_EXEC_INIT_EXEC_RESTART path=/init' build/ash-restart-hot.log
          grep -F 'BOOT_EXEC_USER_HANDOFF ' build/ash-restart-hot.log
          grep -F 'function=__mm_user_ash_main' build/ash-restart-hot.log
          grep -Fx 'BUSYBOX_MINIMACHINE_HELLO' build/ash-restart-hot.log
          grep -Fx 'BUSYBOX_VAR_42' build/ash-restart-hot.log
          grep -Fx 'BUSYBOX_FALSE_STATUS_1' build/ash-restart-hot.log
          grep -F 'BOOT_EXEC_USER_EXIT status=0' build/ash-restart-hot.log
          grep -F 'ASH_RESTART_HOT_STATUS=0' build/ash-restart-hot.log
          ! grep -F 'BOOT_EXEC_BLOCKED ' build/ash-restart-hot.log

      - name: Summarize first BusyBox execution
        if: always()
        run: |
          grep -E 'BOOT_EXEC_(INIT_EXEC_RESTART|CHECKPOINT_RESTORED|USER_HANDOFF|USER_EXTERNAL|USER_SYSCALL|USER_EXIT|BLOCKED|HALTED)|BUSYBOX_MINIMACHINE_HELLO|ASH_RESTART_HOT_(WALL|STATUS)' \
            build/ash-restart-hot.log | tail -360 || true

      - name: Upload restart trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-busybox-ash-restart-hot-${{ github.run_id }}
          path: build/ash-restart-hot.log
          if-no-files-found: error
          retention-days: 7
