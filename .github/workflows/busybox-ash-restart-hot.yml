name: MiniMachine BusyBox Ash Restart Hot

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - scripts/run-minimachine-linux.py
      - src/minimachine/runtime.py
      - .github/workflows/busybox-ash-restart-hot.yml

permissions:
  contents: read
  actions: read

jobs:
  ash-restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared \
            native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download exact Linux image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33295701837
          github-token: ${{ github.token }}
          name: minimachine-linux-initramfs-33295701837
          path: console

      - name: Download proven kernel_execve checkpoint
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33296957158
          github-token: ${{ github.token }}
          name: minimachine-shell-echo-33296957158
          path: echo

      - name: Download frozen ash carrier
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33322123027
          github-token: ${{ github.token }}
          name: minimachine-busybox-ash-carrier-33322123027
          path: ash

      - name: Download current console-read P3 cache
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33322528617
          github-token: ${{ github.token }}
          name: minimachine-linux-p3-console-current-33322528617
          path: console-refresh

      - name: Restart fresh init exec and run ash
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          set -o pipefail
          set +e
          printf 'echo BUSYBOX_MINIMACHINE_HELLO\nvalue=42\necho BUSYBOX_VAR_$value\nfalse\necho BUSYBOX_FALSE_STATUS_$?\nexit 0\n' | \
          /usr/bin/time -f 'ASH_RESTART_HOT_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          timeout --signal=TERM 120 \
          python3 scripts/run-minimachine-linux.py console/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in console-refresh/linux-initramfs-p3-cache-console-current.pkl.gz \
            --initramfs echo/mmsh-echo.cpio \
            --native-vm \
            --checkpoint-in echo/mmsh-echo-kernel-execve.chk.gz \
            --inject-init ash/busybox-ash-first.bflt \
            --restart-run-init-after-checkpoint \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee build/ash-restart-hot.log
          status=${PIPESTATUS[1]}
          set -e
          echo "ASH_RESTART_HOT_STATUS=$status" | tee -a build/ash-restart-hot.log

      - name: Assert real BusyBox handoff
        run: |
          grep -F 'BOOT_EXEC_INIT_EXEC_RESTART path=/init' build/ash-restart-hot.log
          grep -F 'BOOT_EXEC_USER_HANDOFF ' build/ash-restart-hot.log
          grep -F 'function=__mm_user_ash_main' build/ash-restart-hot.log
          grep -Fx 'BUSYBOX_MINIMACHINE_HELLO' build/ash-restart-hot.log
          grep -Fx 'BUSYBOX_VAR_42' build/ash-restart-hot.log
          grep -Fx 'BUSYBOX_FALSE_STATUS_1' build/ash-restart-hot.log
          grep -F 'BOOT_EXEC_USER_EXIT status=0' build/ash-restart-hot.log
          grep -F 'ASH_RESTART_HOT_STATUS=0' build/ash-restart-hot.log
          ! grep -F 'BOOT_EXEC_BLOCKED ' build/ash-restart-hot.log

      - name: Summarize first BusyBox execution
        if: always()
        run: |
          grep -E 'BOOT_EXEC_(INIT_EXEC_RESTART|USER_RUNTIME|USER_EXTERNAL_SURFACE|USER_EXTERNAL_DATA|USER_IMAGE_DATA|USER_ARGS|USER_HANDOFF|NATIVE_APPEND_PACK|NATIVE_APPEND|NATIVE_HOST_APPEND|NATIVE_DATA_APPEND|USER_EXTERNAL|USER_SYSCALL|USER_EXIT|HOST_INPUT|USER_READ_BUFFER|BLOCKED|HALTED)|BUSYBOX_MINIMACHINE_HELLO|ASH_RESTART_HOT_(WALL|STATUS)' \
            build/ash-restart-hot.log | tail -320 || true

      - name: Upload restart trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-busybox-ash-restart-hot-${{ github.run_id }}
          path: build/ash-restart-hot.log
          if-no-files-found: error
          retention-days: 7
