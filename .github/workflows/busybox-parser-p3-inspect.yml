name: MiniMachine BusyBox Parser P3 Inspect

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - .github/workflows/busybox-parser-p3-inspect.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download pointer-phi-fixed multicall image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33396890631
          github-token: ${{ github.token }}
          name: minimachine-busybox-multicall-33396890631
          path: busybox

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-18

      - name: Download frozen whole-LTO carrier
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33300177445
          github-token: ${{ github.token }}
          name: minimachine-busybox-bitcode-33300177445
          path: carrier

      - name: Dump xxreadtoken LLVM
        run: |
          llvm-dis-18 carrier/whole-lto/busybox_unstripped.0.4.opt.bc -o build-busybox.ll
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("build-busybox.ll").read_text()
          match = re.search(r"^define\\b[^\\n]*@xxreadtoken\\([^\\n]*\\)\\s*[^\\{]*\\{", text, re.M)
          if match is None:
              candidates = [line for line in text.splitlines() if "@xxreadtoken" in line][:20]
              raise SystemExit("xxreadtoken definition not found: " + repr(candidates))
          start = match.start()
          end = text.index("\n}", match.end()) + 2
          print("PARSER_LLVM_BEGIN")
          print(text[start:end])
          print("PARSER_LLVM_END")
          PY

      - name: Inspect packed native xxreadtoken instruction
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared native/p3vm.c -o build/libminimachine_p3vm.so
          MINIMACHINE_NATIVE_LIB=${{ github.workspace }}/build/libminimachine_p3vm.so python3 - <<'PY'
          from pathlib import Path
          from src.minimachine.native_vm import NativeVM
          from src.minimachine.user_image import BFLT_HEADER_SIZE, unpack_user_image
          from src.minimachine.vm import Program

          blob = Path("busybox/busybox-multicall.bflt").read_bytes()
          data_start = int.from_bytes(blob[12:16], "big")
          image = unpack_user_image(blob[BFLT_HEADER_SIZE:data_start])
          program = Program(image.functions)
          vm = NativeVM(program)

          code = program.block_code[("__mm_user_xxreadtoken", "19")]
          insts, blocks, _hosts = vm._packed
          block = next(b for b in blocks if b.code == code)
          for ip in range(block.count):
              inst = insts[block.first + ip]
              print(
                  "PARSER_NATIVE_PACK "
                  f"block=19 ip={ip} opcode={inst.opcode} width={inst.width} "
                  f"src_kind={inst.src.kind} src_value={inst.src.value} "
                  f"dst_kind={inst.dst.kind} dst_value={inst.dst.value}"
              )
          linked = program.functions["__mm_user_xxreadtoken"]
          print(
              "PARSER_NATIVE_SLOTS "
              + ",".join(
                  f"{name}:{linked.slot_offsets[name]}"
                  for name in ("17","21","22","37","38","39","40","41","42","46")
              )
          )
          PY

      - name: Dump xxreadtoken P3 and data objects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from src.minimachine.user_image import BFLT_HEADER_SIZE, unpack_user_image

          blob = Path("busybox/busybox-multicall.bflt").read_bytes()
          data_start = int.from_bytes(blob[12:16], "big")
          program = unpack_user_image(blob[BFLT_HEADER_SIZE:data_start])

          fn = next(f for f in program.functions if f.name == "__mm_user_xxreadtoken")
          for block in fn.blocks:
              if block.label in {"15", ".loopexit", "19", ".loopexit4", "45"}:
                  print(f"PARSER_P3_BLOCK {block.label}")
                  for i, inst in enumerate(block.instructions):
                      print(f"PARSER_P3_INST block={block.label} ip={i} {inst!r}")

          if program.image is not None:
              for obj in program.image.objects:
                  if "xxreadtoken" in obj.name:
                      print(f"PARSER_DATA_OBJECT {obj!r}")
          PY
