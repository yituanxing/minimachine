name: MiniMachine BusyBox Bundle Identity Check

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - .github/workflows/busybox-bundle-identity-check.yml

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download old checkpoint bundle
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33347461389
          github-token: ${{ github.token }}
          name: minimachine-busybox-multicall-33347461389
          path: old

      - name: Download current bundle
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33396890631
          github-token: ${{ github.token }}
          name: minimachine-busybox-multicall-33396890631
          path: current

      - name: Compare payload identities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          from src.minimachine.user_image import BFLT_HEADER_SIZE, unpack_user_image
          for label, path in [
              ("old", Path("old/busybox-multicall.bflt")),
              ("current", Path("current/busybox-multicall.bflt")),
          ]:
              blob = path.read_bytes()
              data_start = int.from_bytes(blob[12:16], "big")
              payload = blob[64:data_start]
              print(
                  "BUNDLE_IDENTITY "
                  f"label={label} bflt_bytes={len(blob)} "
                  f"payload_bytes={len(payload)} "
                  f"header={payload[:16].hex()} "
                  f"sha256={hashlib.sha256(payload).hexdigest()}"
              )
              image = unpack_user_image(payload)
              fn = next(f for f in image.functions if f.name == "__mm_user_xxreadtoken")
              block = next(b for b in fn.blocks if b.label == "19")
              inst = block.instructions[3]
              print(
                  "BUNDLE_P3_WIDTH "
                  f"label={label} function=__mm_user_xxreadtoken "
                  f"block=19 ip=3 type={type(inst).__name__} "
                  f"width={inst.width.value}"
              )
          PY
