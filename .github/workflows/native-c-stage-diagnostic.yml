name: Linux MiniMachine Native C Stage Diagnostic

on:
  push:
    branches: [work/native-p3-vm]
    paths:
      - scripts/run-minimachine-linux.py
      - .github/workflows/native-c-stage-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build optimized native P3 VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download default Linux with initramfs
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33264250619
          github-token: ${{ github.token }}
          name: minimachine-linux-initramfs-33264250619
          path: replay-source

      - name: Run to panic with 50M native samples
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          set -o pipefail
          /usr/bin/time -f 'NATIVE_DIAG_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          python3 scripts/run-minimachine-linux.py replay-source/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in replay-source/llvm/linux-initramfs-p3-cache.pkl.gz \
            --initramfs replay-source/out/minimachine-initramfs.cpio \
            --native-vm \
            --native-boot-phases-only \
            --native-report-every 50000000 \
            --max-steps 600000000 \
            --stop-on-panic \
            --progress-every 0 \
            2>&1 | tee replay-source/llvm/native-c-stage-diagnostic.log

      - name: Summarize samples
        if: always()
        run: |
          grep -E 'BOOT_EXEC_NATIVE_PROGRESS|BOOT_EXEC_MILESTONE|BOOT_EXEC_BLOCKED|BOOT_EXEC_NATIVE_LIMIT|BOOT_EXEC_USER_HANDOFF|NATIVE_DIAG_WALL' \
            replay-source/llvm/native-c-stage-diagnostic.log || true

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-native-c-stage-${{ github.run_id }}
          path: replay-source/llvm/native-c-stage-diagnostic.log
          if-no-files-found: ignore
          retention-days: 7
