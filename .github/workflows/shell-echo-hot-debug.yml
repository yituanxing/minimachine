name: MiniMachine Shell Echo Hot Debug

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - src/minimachine/legalize.py
      - scripts/run-minimachine-linux.py
      - .github/workflows/shell-echo-hot-debug.yml

permissions:
  contents: read
  actions: read

jobs:
  echo-hot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build native VM
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared native/p3vm.c -o build/libminimachine_p3vm.so

      - name: Download exact Linux image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33295701837
          github-token: ${{ github.token }}
          name: minimachine-linux-initramfs-33295701837
          path: console

      - name: Download echo kernel_execve hotspot
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33296957158
          github-token: ${{ github.token }}
          name: minimachine-shell-echo-33296957158
          path: echo

      - name: Restore echo shell and trace read handoff
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          set -o pipefail
          printf 'hello\n' | \
          /usr/bin/time -f 'SHELL_ECHO_HOT_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          python3 scripts/run-minimachine-linux.py console/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in console/llvm/linux-initramfs-p3-cache.pkl.gz \
            --initramfs echo/mmsh-echo.cpio \
            --native-vm \
            --checkpoint-in echo/mmsh-echo-kernel-execve.chk.gz \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee build/shell-echo-hot.log

      - name: Summarize echo handoff
        if: always()
        run: |
          grep -E 'BOOT_EXEC_(CHECKPOINT_RESTORED|USER_HANDOFF|HOST_INPUT|USER_READ_BUFFER|USER_SYSCALL|HALTED|BLOCKED)|mmsh>|SHELL_ECHO_HOT_WALL' build/shell-echo-hot.log || true

      - name: Upload echo hot trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-shell-echo-hot-${{ github.run_id }}
          path: build/shell-echo-hot.log
          retention-days: 7
