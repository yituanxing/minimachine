name: SQLite Pipe Kernel Surface

on:
  workflow_dispatch:
  push:
    branches: [work/sqlite-real-software]
    paths:
      - .github/workflows/sqlite-pipe-kernel-surface.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download exact qualified Linux image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33632628029
          github-token: ${{ github.token }}
          name: minimachine-linux-initramfs-33632628029
          path: linux
      - name: Inspect pipe syscall surface
        run: |
          set -o pipefail
          test -s linux/llvm/linked.ll
          grep -nE '^define .*(@(__se_sys_pipe2|__do_sys_pipe2|ksys_pipe|do_pipe2|__se_sys_pipe)\()' \
            linux/llvm/linked.ll | tee pipe-symbols.txt || true
          grep -nE '@(__se_sys_pipe2|__do_sys_pipe2|ksys_pipe|do_pipe2|__se_sys_pipe)\b' \
            linux/llvm/linked.ll | head -80 | tee -a pipe-symbols.txt || true
          if grep -Eq '^define .*@__se_sys_pipe2\(' linux/llvm/linked.ll; then
            echo PIPE_KERNEL_SURFACE=se-sys-pipe2
          elif grep -Eq '^define .*@ksys_pipe\(' linux/llvm/linked.ll; then
            echo PIPE_KERNEL_SURFACE=ksys-pipe
          elif grep -Eq '^define .*@do_pipe2\(' linux/llvm/linked.ll; then
            echo PIPE_KERNEL_SURFACE=do-pipe2
          else
            echo PIPE_KERNEL_SURFACE=missing
            exit 1
          fi
