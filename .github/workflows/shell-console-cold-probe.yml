name: MiniMachine Shell Console Cold Probe

on:
  workflow_dispatch:
  push:
    branches: [work/native-p3-vm]
    paths:
      - .github/workflows/shell-console-cold-probe.yml

permissions:
  contents: read
  actions: read

jobs:
  shell-console:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build native VM and shell initramfs
        run: |
          mkdir -p build
          gcc -O3 -DNDEBUG -std=c11 -fPIC -shared native/p3vm.c -o build/libminimachine_p3vm.so
          python3 scripts/build-minimachine-shell.py build/mmsh-prompt.bflt --mode prompt-probe
          python3 scripts/build-minimachine-initramfs.py build/mmsh.cpio \
            --init-image build/mmsh-prompt.bflt \
            --init-output build/mmsh-prompt-copy.bflt
          ls -lh build/mmsh-prompt.bflt build/mmsh.cpio

      - name: Download console-capable Linux image
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 33295701837
          github-token: ${{ github.token }}
          name: minimachine-linux-initramfs-33295701837
          path: console

      - name: Cold boot shell through Linux console
        env:
          MINIMACHINE_NATIVE_LIB: ${{ github.workspace }}/build/libminimachine_p3vm.so
        run: |
          set -o pipefail
          /usr/bin/time -f 'SHELL_CONSOLE_WALL=%e USER=%U SYS=%S MAXRSS_KB=%M' \
          python3 scripts/run-minimachine-linux.py console/llvm/linked.ll \
            --linker-contract configs/linux-6.6.143-minimachine-linker.json \
            --program-cache-in console/llvm/linux-initramfs-p3-cache.pkl.gz \
            --initramfs build/mmsh.cpio \
            --native-vm \
            --native-boot-phases-only \
            --checkpoint-function kernel_execve \
            --checkpoint-function-hit 1 \
            --checkpoint-out build/mmsh-kernel-execve.chk.gz \
            --stop-on-panic \
            --max-steps 0 \
            --progress-every 0 \
            2>&1 | tee build/shell-console.log

      - name: Assert real userspace write path
        run: |
          grep -F 'BOOT_EXEC_CHECKPOINT_SAVED' build/shell-console.log
          grep -F 'BOOT_EXEC_USER_HANDOFF ' build/shell-console.log
          grep -F 'BOOT_EXEC_USER_SYSCALL ' build/shell-console.log
          grep -F 'nr=64 ' build/shell-console.log
          grep -F 'result=6' build/shell-console.log
          grep -F 'mmsh> ' build/shell-console.log
          grep -F 'BOOT_EXEC_HALTED' build/shell-console.log

      - name: Upload shell console result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-shell-console-${{ github.run_id }}
          path: |
            build/mmsh-prompt.bflt
            build/mmsh.cpio
            build/mmsh-kernel-execve.chk.gz
            build/shell-console.log
          if-no-files-found: ignore
          retention-days: 7
