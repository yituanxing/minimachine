name: Linux Full500 Legalizer

on:
  push:
    branches: [main]
    paths:
      - src/minimachine/**
      - scripts/legalize_bc.py
      - scripts/normalize-corpus.sh
      - scripts/subset_corpus.py
      - .github/workflows/linux-full500-legalizer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minimachine-linux-full500-legalizer
  cancel-in-progress: true

jobs:
  full500:
    runs-on: ubuntu-24.04
    env:
      ROOT: ${{ github.workspace }}/build/full500
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-18 clang-18
          echo "nproc=$(nproc)"

      - name: Restore legalizer full500 cache
        id: legalizer-cache
        uses: actions/cache/restore@v4
        with:
          path: build/full500/raw
          key: minimachine-legalizer-full500-v1-${{ hashFiles('scripts/subset_corpus.py', 'configs/linux-6.6.143-riscv.env') }}

      - name: Restore full-all corpus
        if: steps.legalizer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: build/linux-6.6.143-riscv-full-all/full-all-corpus
          key: minimachine-linux-6.6.143-riscv-defconfig-llvm18-full-all-v1-${{ hashFiles('configs/linux-6.6.143-riscv.env', 'scripts/materialize-linux.sh', 'scripts/select-corpus.py', 'scripts/export-corpus.py') }}
          restore-keys: |
            minimachine-linux-6.6.143-riscv-defconfig-llvm18-full-all-v1-

      - name: Derive full500
        if: steps.legalizer-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          python3 scripts/subset_corpus.py \
            --input build/linux-6.6.143-riscv-full-all/full-all-corpus \
            --output "$ROOT/raw" \
            --count 500

      - name: Save legalizer full500 cache
        if: steps.legalizer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/full500/raw
          key: minimachine-legalizer-full500-v1-${{ hashFiles('scripts/subset_corpus.py', 'configs/linux-6.6.143-riscv.env') }}

      - name: Verify full500
        run: |
          set -Eeuo pipefail
          test "$(find "$ROOT/raw" -type f -name '*.bc' | wc -l)" -eq 500

      - name: Normalize full500
        run: |
          set -Eeuo pipefail
          JOBS="$(nproc)" bash scripts/normalize-corpus.sh "$ROOT/raw" "$ROOT/normalized"

      - name: Legalize full500 to μIR
        run: |
          set -Eeuo pipefail
          mkdir -p "$ROOT/reports"
          python3 scripts/legalize_bc.py "$ROOT/normalized" \
            --llvm-major 18 \
            --json "$ROOT/reports/legalize.json"

      - name: Full500 summary
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open("build/full500/reports/legalize.json"))
          print(f"FULL500 pass={r['pass']}/500 fail={r['fail']}")
          counts={}
          for x in r["records"]:
              if x["status"]=="FAIL":
                  key=x["error"].split(":",3)[-1].strip()
                  counts[key]=counts.get(key,0)+1
          for k,v in sorted(counts.items(), key=lambda x:(-x[1],x[0]))[:30]:
              print(f"BLOCKER {v}x {k}")
          PY

      - name: Upload full500 report
        uses: actions/upload-artifact@v4
        with:
          name: minimachine-full500-legalizer-${{ github.run_id }}
          path: build/full500/reports/legalize.json
          retention-days: 14
